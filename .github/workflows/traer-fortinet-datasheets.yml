name: traer-fortinet-datasheets

# Trae los datasheets por serie de los 5 FortiGate que el Product Matrix no cubre, para leer
# a mano su "New Sessions/Sec" y cerrar el ultimo hueco de `cps` (hoy 53 de 58).
#
# POR QUE ESTOS 5 Y NO OTROS
# El Product Matrix es un "Top Selling Models Matrix" -un subconjunto curado-, y 100F, 200F,
# 400F, 401F y 600F no aparecen en ninguna de sus paginas. No es un bloqueo de acceso: es que
# ese documento no los trae. La ficha por serie si los cubre.
#
# LAS URL NO SE ADIVINAN
# Las de 400F y 600F salieron de una busqueda que las devolvio explicitamente. Las de 100F y
# 200F siguen el mismo patron del sitio pero NO estan confirmadas, asi que van marcadas como
# tales y el workflow reporta si fallan en vez de darlas por buenas: adivinar una URL es como
# se agregaron a FUENTES dos fichas de Juniper que ya no existian.
#
# LA FIRMA MANDA SOBRE EL CONTENT-TYPE
# Se comprueba `%PDF-` en los primeros bytes. Una pagina de aterrizaje servida con la cabecera
# equivocada se reporta como lo que es, en vez de guardarse con extension .pdf -que es la forma
# silenciosa de romper esto, y ya paso con las fichas de Juniper.
#
# NO EXTRAE NADA. Publica los PDF en una rama de transporte para que una persona los lea
# pagina por pagina y transcriba a un CSV que pase por `npm run cps`, que contrasta cada fila
# contra el `sess` ya verificado. Extraer una tabla de un PDF sin esa lectura es justo donde
# se cuela la fila desplazada.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Bajar los datasheets
        run: |
          node -e "
            const fs = require('fs');
            const base = 'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/pdf/';
            const docs = [
              { archivo: 'fortigate-400f-series.pdf', confirmada: true },
              { archivo: 'fortigate-600f-series.pdf', confirmada: true },
              { archivo: 'fortigate-100f-series.pdf', confirmada: false },
              { archivo: 'fortigate-200f-series.pdf', confirmada: false },
            ];
            const espera = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const informe = [];
              for (const d of docs) {
                const url = base + d.archivo;
                try {
                  const r = await fetch(url, {
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                      Accept: 'application/pdf,*/*',
                    },
                  });
                  const buf = Buffer.from(await r.arrayBuffer());
                  const esPdf = buf.length > 4 && buf.subarray(0, 5).toString('latin1') === '%PDF-';
                  if (esPdf) fs.writeFileSync(d.archivo, buf);
                  informe.push({
                    archivo: d.archivo, urlConfirmadaPorBusqueda: d.confirmada,
                    status: r.status, bytes: buf.length, esPdf,
                  });
                } catch (e) {
                  informe.push({ archivo: d.archivo, urlConfirmadaPorBusqueda: d.confirmada, error: String(e.message || e) });
                }
                await espera(2000 + Math.random() * 2000);
              }
              console.log(JSON.stringify(informe, null, 2));
              fs.writeFileSync('datasheets-informe.json', JSON.stringify(informe, null, 2));
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fuente/fortinet-datasheets
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ./*.pdf datasheets-informe.json
          git commit -q -m 'Datasheets por serie de FortiGate, material de trabajo'
          git push -f origin fuente/fortinet-datasheets

      - name: Resumen
        if: always()
        run: |
          {
            echo '## FortiGate — datasheets por serie (los 5 sin `cps`)'
            echo ''
            echo '```json'
            cat datasheets-informe.json 2>/dev/null || echo '(sin resultado: revisar el paso anterior)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
