name: traer-fortinet-pendientes

# Baja a una rama de transporte los documentos que quedan bloqueados del modulo Fortinet,
# para poder leerlos desde una sesion que no tiene salida a los dominios del fabricante:
#
#   F6 · las fichas por serie del FortiGate 100F y 200F, sus QuickStart Guide y los System
#        Guide de los chasis 7081F y 7121F, que eran los 4 modelos sin ninguna figura de
#        hardware. La pagina «Hardware» de una ficha por serie -pagina 7 en las 28 que ya se
#        leyeron- es de donde salen las 68 figuras frontal/trasera del resto.
#   F2 · los Ordering Guide de FortiGuard y de Secure SD-WAN, de los que salen los SKU de los tres servicios
#        avanzados de SD-WAN (Underlay & Application Monitoring, Overlay Orchestration,
#        conector FortiSASE) que hoy van con `sku: null` y bloquean la exportacion.
#
# NO EXTRAE NADA. Igual que `traer-fortinet-matrix.yml`: la lectura sigue siendo humana y el
# dato entra por los importadores con doble anclaje o por la extraccion de figuras, que se
# corre a mano. Automatizar la extraccion de una tabla o de una figura de un PDF es justo
# donde se cuelan las filas desplazadas y las caras cambiadas.
#
# POR QUE UNA RAMA Y NO main NI UN PR: son material de trabajo de terceros, no activos de la
# aplicacion. Se traen con `git fetch` y se descartan tras transcribir.
#
# POR QUE EN ACTIONS: medido otra vez el 2026-09-23 desde el entorno donde se edita este
# repositorio, `www.fortinet.com` y `docs.fortinet.com` devuelven `connect_rejected` del
# proxy de egreso — una denegacion de politica de la organizacion, no un fallo de red. Los
# ejecutores de GitHub no pasan por ese proxy. Es la misma via ya aprobada aqui.
#
# UN 404 NO SE DA POR BUENO NI TUMBA LA CORRIDA. Las URL de 100F y 200F ya dieron 404 en el
# patron que siguen las otras 26 fichas, y eso esta reportado como tal en PENDIENTES.md. El
# workflow prueba las rutas conocidas de cada documento, publica lo que SI responde y deja en
# el resumen, documento a documento, que codigo dio cada intento: un informe que dice «no se
# pudo» con su codigo vale, y uno que se calla los fallos para salir en verde no.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Descargar los documentos que faltan
        run: |
          node -e "
            const fs = require('fs');
            // Cada documento con TODAS las rutas conocidas, en orden. Fortinet sirve las
            // fichas nuevas en /data-sheets/pdf/ y las de la generacion F en /data-sheets/,
            // un subdirectorio de diferencia que ya explico doce 404 el 2026-09-03.
            // Las URL de la primera corrida (2026-09-23) se ADIVINARON por patron y dieron 404
            // las quince. Las de abajo salieron de BUSCAR cada documento el 2026-09-24: las
            // del CDN de fortinet.com y las de fortinetweb.s3.amazonaws.com, que es donde
            // docs.fortinet.com guarda los PDF de sus guias (las URL de /document/ son una
            // aplicacion web, no un documento). Donde la ficha en ingles ya no se publica se
            // prueba despues la version coreana oficial -mismas tablas, cifras identicas- y la
            // adjunta de la base de conocimiento del propio fabricante.
            const DOCS = [
              { archivo: 'fg-100f-serie.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/pdf/ds-fortigate-100f-series.pdf',
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/ds-fortigate-100f-series.pdf',
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/fortigate-100f-series.pdf',
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/ko_kr/ds-fortigate-100f-series_ko.pdf',
              ] },
              { archivo: 'fg-200f-serie.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/pdf/ds-fortigate-200f-series.pdf',
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/ds-fortigate-200f-series.pdf',
                'https://community.fortinet.com/tpykb84852/attachments/tpykb84852/TKB20/2329/1/fortigate-200f-series.pdf',
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/ko_kr/ds-fortigate-200f-series_ko.pdf',
              ] },
              { archivo: 'fg-7081f-system-guide.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/17ef7271-b6d2-11ed-8e6d-fa163e15d75b/fortigate-7081F-system-guide.pdf',
              ] },
              { archivo: 'fg-7121f-system-guide.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/c7e69026-9283-11eb-b70b-00505692583a/fortigate-7121F-system-guide.pdf',
              ] },
              { archivo: 'og-fortiguard.pdf', tipo: 'pdf', pendiente: 'F2', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-fortiguard.pdf',
              ] },
              { archivo: 'og-secure-sdwan.pdf', tipo: 'pdf', pendiente: 'F2', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-secure-sdwan.pdf',
              ] },
              // Condicion 2 del GO CONDICIONADO: la retirada del modo tunel de SSL-VPN se cito
              // del informe y no se leyo. Es una pagina web, asi que se valida por su TEXTO: una
              // pagina de error o un cascaron de JavaScript tambien responden 200.
              { archivo: 'fortios-763-ssl-vpn-tunel.html', tipo: 'html', pendiente: 'GO-2',
                debeContener: 'tunnel mode', urls: [
                'https://docs.fortinet.com/document/fortigate/7.6.3/fortios-release-notes/173430/ssl-vpn-tunnel-mode-no-longer-supported',
                'https://docs.fortinet.com/document/fortigate/7.6.6/fortios-release-notes/173430/ssl-vpn-tunnel-mode-replaced-with-ipsec-vpn',
              ] },
              // La regla de 7.6.0 (SSL-VPN retirado en los modelos de 2 GB de RAM) se aplicaba sin
              // saber QUE modelos tienen 2 GB: el Product Matrix no publica la RAM. La lista esta
              // en las Release Notes de 7.6.0, que docs.fortinet.com guarda como PDF en S3.
              { archivo: 'fortios-760-release-notes.pdf', tipo: 'pdf', pendiente: 'GO-2',
                debeContener: null, urls: [
                'https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/51fcbb4f-33ff-11ef-bfe5-fa163e15d75b/fortios-v7.6.0-release-notes.pdf',
              ] },
              // Los SKU que dejan la cotizacion en borrador ademas de F2: FortiClient EMS por
              // tramo, FortiSASE, FortiSandbox dedicado y FortiAnalyzer.
              { archivo: 'og-forticlient.pdf', tipo: 'pdf', pendiente: 'SKU', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-forticlient.pdf',
              ] },
              { archivo: 'og-fortisase.pdf', tipo: 'pdf', pendiente: 'SKU', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-fortisase.pdf',
              ] },
              { archivo: 'og-fortisandbox.pdf', tipo: 'pdf', pendiente: 'SKU', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-fortisandbox.pdf',
              ] },
              { archivo: 'og-fortianalyzer.pdf', tipo: 'pdf', pendiente: 'SKU', urls: [
                'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/og-fortianalyzer.pdf',
              ] },
              // Las figuras de 100F y 200F que se sirven salen de sus QuickStart Guide, leidas el
              // 2026-09-24 desde una maquina sin el proxy y sin guardar la URL. Se traen aqui para
              // contrastar pagina y rotulo contra una segunda copia, y para que tengan URL vigilable.
              { archivo: 'fg-100f-qsg.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/42d64717-83f1-11e9-81a4-00505692583a/FG-100F-QSG.pdf',
              ] },
              { archivo: 'fg-200f-qsg.pdf', tipo: 'pdf', pendiente: 'F6', urls: [
                'https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/89694abf-1ef2-11eb-96b9-00505692583a/FG-200F-Series-QSG.pdf',
              ] },
            ];
            const informe = [];
            (async () => {
              fs.mkdirSync('fuente-fortinet', { recursive: true });
              for (const doc of DOCS) {
                const intentos = [];
                let guardado = false;
                for (const url of doc.urls) {
                  let res;
                  try {
                    res = await fetch(url, { headers: { 'User-Agent': 'presales-traer-fuente/1.0' } });
                  } catch (e) { intentos.push({ url, error: String(e.message || e) }); continue; }
                  if (!res.ok) { intentos.push({ url, status: res.status }); continue; }
                  const buf = Buffer.from(await res.arrayBuffer());
                  // LA FIRMA DEL CONTENIDO MANDA SOBRE EL CODIGO HTTP: un 200 que devuelve la
                  // pagina de error en HTML donde se espera un PDF es un 404 disfrazado, y
                  // guardarlo dejaria un documento vacio con pinta de bueno.
                  if (doc.tipo === 'pdf' && buf.subarray(0, 4).toString() !== '%PDF') {
                    intentos.push({ url, status: res.status, firma: buf.subarray(0, 8).toString('hex'), nota: 'no es un PDF' });
                    continue;
                  }
                  if (doc.debeContener && !buf.toString('utf8').toLowerCase().includes(doc.debeContener)) {
                    intentos.push({ url, status: res.status, bytes: buf.length, nota: 'no contiene el texto esperado' });
                    continue;
                  }
                  fs.writeFileSync('fuente-fortinet/' + doc.archivo, buf);
                  intentos.push({ url, status: res.status, bytes: buf.length, guardado: true });
                  guardado = true;
                  break;
                }
                informe.push({ archivo: doc.archivo, pendiente: doc.pendiente, guardado, intentos });
              }
              fs.writeFileSync('fuente-fortinet/informe.json', JSON.stringify(informe, null, 2));
              for (const d of informe) {
                console.log((d.guardado ? 'OK   ' : 'FALLA') + '  ' + d.pendiente + '  ' + d.archivo);
                for (const i of d.intentos) console.log('        ' + (i.status || i.error) + '  ' + i.url + (i.nota ? '  <- ' + i.nota : ''));
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B fuente/fortinet-pendientes
          git add fuente-fortinet/
          git commit -m "Documentos pendientes de Fortinet (F6, F2) descargados $(date -u +%Y-%m-%d)"
          git push --force origin fuente/fortinet-pendientes

      - name: Resumen
        run: |
          {
            echo '## Documentos pendientes de Fortinet'
            echo ''
            echo 'Rama `fuente/fortinet-pendientes`. Traerla con:'
            echo '```'
            echo 'git fetch origin fuente/fortinet-pendientes'
            echo '```'
            echo ''
            echo 'Qué respondió cada intento (un 404 se reporta, no se da por bueno):'
            echo '```'
            node -e "
              const inf = require('./fuente-fortinet/informe.json');
              for (const d of inf) {
                console.log((d.guardado ? 'OK   ' : 'FALLA') + '  ' + d.pendiente + '  ' + d.archivo);
                for (const i of d.intentos) console.log('        ' + (i.status || i.error) + '  ' + i.url + (i.nota ? '  <- ' + i.nota : ''));
              }
            "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
