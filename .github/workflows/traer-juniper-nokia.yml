name: traer-juniper-nokia

# Dos pendientes en dominios que YA se sabe que responden a un ejecutor de Actions
# (juniper.net entrego 5 guias de hardware el 2026-09-03; nokia.com respondio al vigia).
#
# 1. PENDIENTE 5 (Juniper). La matriz de 2020 no cubre la generacion 2024, asi que
#    SRX1600/2300/4300/4700 y los SRX4100/4200 se quedaron con `fw` y nada mas -sin fwImix,
#    ips ni atp. Las fichas POR MODELO si las publican, y el patron de URL esta confirmado por
#    busqueda para el 1600 y el 2300: .../security/srx<modelo>-firewall-datasheet.pdf. Los
#    demas van por ese mismo patron y su 404, si lo hay, se reporta.
#
# 2. PENDIENTE 15 (Nokia). Los 18 modelos van con 0 de alimentacion, y Nokia ni siquiera
#    figuraba en la lista de cobertura del registro. Sus fichas viven en nokia.com/asset/<id>,
#    que es la URL OFICIAL: se probaron las dos formas que sirve ese CDN (/asset/<id>/ y
#    /asset/f/<id>/) porque la busqueda devolvio las dos. No se usan los espejos de terceros
#    que aparecieron (al-enterprise.com, tempestns.com, cloudfront): este catalogo no sustituye
#    un documento oficial por una copia de reventa, la misma regla que dejo en null la ficha
#    del Aruba 7200.
#
# Como siempre: firma `%PDF-` obligatoria, y no se extrae nada — la lectura de las tablas
# sigue siendo humana, que es donde este repositorio no automatiza a proposito.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Pedir los documentos
        run: |
          node -e "
            const fs = require('fs');
            const jd = 'https://www.juniper.net/content/dam/www/assets/datasheets/us/en/security/';
            const objetivos = [
              // Juniper: patron confirmado por busqueda en el 1600 y el 2300.
              { f: 'ds-srx1600.pdf', u: jd + 'srx1600-firewall-datasheet.pdf' },
              { f: 'ds-srx2300.pdf', u: jd + 'srx2300-firewall-datasheet.pdf' },
              { f: 'ds-srx4300.pdf', u: jd + 'srx4300-firewall-datasheet.pdf' },
              { f: 'ds-srx4700.pdf', u: jd + 'srx4700-firewall-datasheet.pdf' },
              { f: 'ds-srx4100.pdf', u: jd + 'srx4100-firewall-datasheet.pdf' },
              { f: 'ds-srx4200.pdf', u: jd + 'srx4200-firewall-datasheet.pdf' },
              { f: 'ds-srx300-line.pdf', u: jd + 'srx300-line-firewall-datasheet.pdf' },
              // Nokia: ids de activo oficiales, en las dos formas que sirve su CDN.
              { f: 'nokia-7220-ixr-d.pdf', u: 'https://www.nokia.com/asset/f/207599/' },
              { f: 'nokia-7220-ixr-d-alt.pdf', u: 'https://www.nokia.com/asset/207599/' },
              { f: 'nokia-7750-sr-1x.pdf', u: 'https://www.nokia.com/asset/f/212738/' },
              { f: 'nokia-7750-sr-s.pdf', u: 'https://www.nokia.com/asset/f/205421/' },
              { f: 'nokia-7250-ixr-e.pdf', u: 'https://www.nokia.com/asset/f/206825/' },
              { f: 'nokia-7250-ixr.pdf', u: 'https://www.nokia.com/asset/f/214227/' },
            ];
            const espera = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const informe = [];
              for (const o of objetivos) {
                try {
                  const r = await fetch(o.u, {
                    redirect: 'follow',
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                      Accept: 'application/pdf,*/*',
                      'Accept-Language': 'en-US,en;q=0.9',
                    },
                  });
                  const buf = Buffer.from(await r.arrayBuffer());
                  const esPdf = buf.length > 4 && buf.subarray(0, 5).toString('latin1') === '%PDF-';
                  if (esPdf) fs.writeFileSync(o.f, buf);
                  informe.push({ archivo: o.f, url: o.u, status: r.status, kb: Math.round(buf.length / 1024), esPdf });
                  console.log(o.f, r.status, esPdf ? 'PDF OK' : 'no es PDF');
                } catch (e) {
                  informe.push({ archivo: o.f, url: o.u, error: String(e.message || e) });
                  console.log(o.f, 'ERROR', e.message);
                }
                await espera(3000 + Math.random() * 2000);
              }
              fs.writeFileSync('informe.json', JSON.stringify(informe, null, 2));
              console.log(JSON.stringify(informe, null, 2));
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fuente/juniper-nokia
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f informe.json
          git add -f ./*.pdf 2>/dev/null || true
          git commit -q -m 'Fichas Juniper de la generacion 2024 y fichas Nokia, material de trabajo'
          git push -f origin fuente/juniper-nokia

      - name: Resumen
        if: always()
        run: |
          {
            echo '## Fichas Juniper (pendiente 5) y Nokia (pendiente 15)'
            echo ''
            echo '```json'
            cat informe.json 2>/dev/null || echo '(sin resultado)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
