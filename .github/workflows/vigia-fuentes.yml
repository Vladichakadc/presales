name: vigia-fuentes

# Vigila los documentos oficiales de los que sale el catalogo y abre un issue cuando alguno
# cambia. Corre en GitHub Actions y no en el entorno donde se edita el repositorio porque
# alli el proxy de egreso de la organizacion responde 403 a fortinet.com, juniper.net y a los
# dominios de HPE y Huawei; los ejecutores de GitHub no pasan por ese proxy.
#
# SI TAMPOCO DESDE AQUI SE ALCANZAN, el informe lo dira con el codigo exacto y el issue lo
# recogera. Eso es un resultado valido: significa que el pendiente vuelve a la ruta A de
# IMPORTAR-CATALOGO.md (correrlo desde una maquina propia). No se intenta ninguna otra salida.
#
# NO EXTRAE DATOS. Compara hashes y avisa. La lectura del documento sigue siendo humana y el
# dato entra por npm run cps / juniper / huawei, que contrastan antes de escribir: extraer
# una tabla de un PDF automaticamente es justo donde se cuelan las filas desplazadas.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --escribir actualiza fuentes.lock.json con lo medido. Sin eso el vigia compararia
      # siempre contra un lock vacio, reportaria "primera medicion" cada semana y no
      # detectaria un cambio jamas — un vigia que no recuerda no vigila.
      - name: Revisar las fuentes
        id: vigia
        run: |
          node scripts/vigia-fuentes.js --json --escribir > vigia.json
          node scripts/vigia-fuentes.js | tee resumen.txt
          node -e "
            const d = require('./vigia.json');
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'cambiados=' + d.cambiados.length + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'inalcanzables=' + d.inalcanzables.length + '\n');
          "

      # EL LOCK VA POR PULL REQUEST Y NO POR PUSH A main (2026-09-14).
      #
      # MEDIDO: el commit 61dedc65 de este mismo workflow se desplego en Railway con SUCCESS
      # SIN que corrieran ni `verificar` ni `pantallas` -- no existe ninguna corrida de esos dos
      # para ese SHA. La causa es de GitHub: los eventos disparados con el GITHUB_TOKEN por
      # defecto no crean corridas nuevas, para evitar bucles recursivos. Asi que la red que
      # describe CLAUDE.md tiene aqui un agujero DISTINTO del pendiente 33: Railway no espera a
      # un check que nunca llega a crearse.
      #
      # Por PR el camino a main pasa por una persona, y eso lo cierra EN CUALQUIERA DE LOS DOS
      # CASOS posibles: si el PR de bot crea corridas en estado "pendiente de aprobacion", un
      # mantenedor las aprueba y CI corre sobre el PR; y si no crea ninguna, el merge lo hace
      # una persona y ESE push a main si dispara verificar y pantallas, que es el check que
      # Railway espera. El arreglo no depende de cual de los dos sea, y bien esta, porque no se
      # pudo confirmar desde este entorno: docs.github.com responde 403 por politica de egreso,
      # y un 403 de politica se reporta, no se rodea.
      #
      # Un PAT o un App token harian que el push disparara los workflows, pero meten un secreto
      # de larga vida con escritura sobre main: peor, y la misma forma que este repositorio ya
      # rechazo al descartar el entorno de staging.
      #
      # Y de paso deja de redesplegar produccion cada semana por un archivo que el servidor no
      # lee: el lock solo lo consultan el propio vigia y `npm run catalogo`.
      #
      # Se hace `git add` ANTES de comprobar si hay cambios: `git diff` no ve un archivo sin
      # seguimiento, asi que en la primera corrida -justo cuando el lock todavia no existe y es
      # cuando mas importa guardarlo- habria dicho "sin cambios" y no habria guardado nada.
      - name: Guardar lo medido en una rama
        id: guardar
        run: |
          git add -- server/seed/legacyData/fuentes.lock.json
          if git diff --cached --quiet -- server/seed/legacyData/fuentes.lock.json; then
            echo 'El lock no cambio; no hay nada que guardar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Una sola rama reutilizada, por lo mismo que se reutiliza el issue abierto: una rama
          # por semana acumularia PR que nadie cierra. --force-with-lease y no --force: si
          # alguien empujo a esa rama a mano, se prefiere fallar a pisarselo.
          git checkout -B vigia/fuentes
          git commit -m 'vigia: actualiza el hash de las fuentes medidas'
          git push --force-with-lease origin vigia/fuentes
          echo 'rama=vigia/fuentes' >> "$GITHUB_OUTPUT"

      - name: Abrir o actualizar el PR del lock
        if: steps.guardar.outputs.rama != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const abiertos = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:vigia/fuentes`,
            });
            if (abiertos.data.length) {
              core.info(`Ya hay PR abierto: #${abiertos.data[0].number}. La rama se actualizo.`);
              return;
            }
            const cuerpo = [
              'Corrida semanal del vigia. **Este PR solo mueve `fuentes.lock.json`**: no toca el',
              'catalogo ni ninguna cifra.',
              '',
              'Un documento que el vigia vio CAMBIAR conserva su `hashVerificado` y queda en la',
              'cola de revision hasta que una persona lo contraste: el lock ya no se traga el',
              'cambio que acaba de denunciar. Para cerrarlo, abre el documento, aplica el dato con',
              'su importador (`npm run cps` / `juniper` / `huawei`) y despues declara la revision:',
              '',
              '    npm run vigia -- --revisado <fabricante> <url>',
              '',
              'El detalle de que cambio esta en el issue con la etiqueta `vigia-fuentes`.',
              '',
              '---',
              '_Generado por [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const pr = await github.rest.pulls.create({
              owner, repo, head: 'vigia/fuentes', base: 'main',
              title: 'vigia: actualiza el hash de las fuentes medidas',
              body: cuerpo,
            });
            core.info(`PR abierto: #${pr.data.number}`);

      - name: Publicar el resumen en la corrida
        run: |
          {
            echo '## Vigia de fuentes'
            echo '```'
            cat resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Solo se abre issue cuando hay algo que hacer. Un documento sin cambios no merece
      # ruido semanal: el resumen de la corrida ya deja constancia de que se miro.
      - name: Abrir issue si alguna fuente cambio o no se pudo leer
        if: steps.vigia.outputs.cambiados != '0' || steps.vigia.outputs.inalcanzables != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('vigia.json', 'utf8'));
            const lineas = [];

            if (d.cambiados.length) {
              lineas.push('## Fuentes que cambiaron', '');
              lineas.push('El documento oficial ya no es el mismo que se uso para verificar el catalogo.');
              lineas.push('Abrirlo, leerlo y aplicar el dato con el importador que corresponda');
              lineas.push('(`npm run cps`, `npm run juniper`, `npm run huawei`), que contrasta antes de escribir.', '');
              for (const r of d.cambiados) {
                lineas.push(`- **${r.vendor}** — ${r.documento}`);
                lineas.push(`  - ${r.url}`);
                lineas.push(`  - medido antes: \`${(r.hashPrevio || '').slice(0, 16)}\` el ${r.medidoAntes || 'desconocido'}`);
                lineas.push(`  - ahora: \`${r.hash.slice(0, 16)}\` (${r.bytes} bytes)`);
              }
              lineas.push('');
            }

            if (d.inalcanzables.length) {
              lineas.push('## Fuentes que no se pudieron leer', '');
              lineas.push('Esto **no** es "sin cambios": es que no se pudo comprobar. Un 403 es politica de');
              lineas.push('egreso y se reporta, no se rodea — en ese caso el pendiente vuelve a la ruta A de');
              lineas.push('`IMPORTAR-CATALOGO.md`, correrlo desde una maquina propia.', '');
              for (const r of d.inalcanzables) {
                lineas.push(`- **${r.vendor}** — ${r.documento}: ${r.detalle}`);
                lineas.push(`  - ${r.url}`);
              }
              lineas.push('');
            }

            lineas.push('---');
            lineas.push('_Generado por [Claude Code](https://claude.ai/code)_');

            const titulo = d.cambiados.length
              ? `Fuentes del catalogo: ${d.cambiados.length} cambiaron`
              : `Fuentes del catalogo: ${d.inalcanzables.length} no se pudieron leer`;

            // Se reutiliza el issue abierto si ya existe, para no acumular uno por semana.
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'vigia-fuentes',
            });
            const cuerpo = lineas.join('\n');
            if (abiertos.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: abiertos.data[0].number, body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: cuerpo, labels: ['vigia-fuentes'],
              });
            }
