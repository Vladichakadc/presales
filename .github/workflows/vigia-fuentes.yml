name: vigia-fuentes

# Vigila los documentos oficiales de los que sale el catalogo y abre un issue cuando alguno
# cambia. Corre en GitHub Actions y no en el entorno donde se edita el repositorio porque
# alli el proxy de egreso de la organizacion responde 403 a fortinet.com, juniper.net y a los
# dominios de HPE y Huawei; los ejecutores de GitHub no pasan por ese proxy.
#
# SI TAMPOCO DESDE AQUI SE ALCANZAN, el informe lo dira con el codigo exacto y el issue lo
# recogera. Eso es un resultado valido: significa que el pendiente vuelve a la ruta A de
# IMPORTAR-CATALOGO.md (correrlo desde una maquina propia). No se intenta ninguna otra salida.
#
# NO EXTRAE DATOS. Compara hashes y avisa. La lectura del documento sigue siendo humana y el
# dato entra por npm run cps / juniper / huawei, que contrastan antes de escribir: extraer
# una tabla de un PDF automaticamente es justo donde se cuelan las filas desplazadas.
#
# DOS JOBS (2026-10-02). Hasta ese dia un solo job tenia `contents: write`, `issues: write` y
# `pull-requests: write`, dejaba el token guardado en .git/config y, con el, corria `npm ci`
# (que ejecuta los scripts de instalacion de cada dependencia) y procesaba lo que devolvian
# seis dominios de fabricantes. Una dependencia comprometida podia leer ese token y empujar a
# main, que en este repositorio es desplegar en produccion. Ahora:
#   - `medir` solo puede leer, no guarda el token y no instala nada: el script solo usa
#     modulos de Node y `fetch`. Deja lo medido como artefacto.
#   - `publicar` tiene los permisos y no ejecuta nada que venga de fuera: baja el artefacto
#     FUERA del repositorio, lo valida contra el lock de main (scripts/vigia-publicar.js:
#     la corrida no puede dar por verificado un documento que cambio) y solo entonces copia
#     el lock, empuja la rama y escribe el issue. Corre aunque `medir` falle, y cualquier
#     fallo (la medicion, la descarga, la validacion o el push) acaba escrito en el issue.
#
# Y SE MIDIO QUE LA VIGIA LLEVABA TRES SEMANAS SIN AVISAR. La corrida del 2026-09-21 empujo la
# rama y fallo al crear el PR («GitHub Actions is not permitted to create or approve pull
# requests»: un ajuste del repositorio que esta apagado, y que si se enciende tambien deja a
# Actions APROBAR PR). La del 2026-09-28 fallo antes, en el push («stale info»: con la rama ya
# creada, `--force-with-lease` sin valor esperado no tiene contra que comparar en un checkout
# que solo trae main). Como el job se cortaba ahi, el issue no se actualizaba. Ahora el PR no
# se crea desde aqui: el issue y el resumen de la corrida llevan el enlace para abrirlo.
#
# TERCER JOB, `contrastar` (2026-10-14). Cuando el lock que acaba de medir deja el Fortinet
# Product Matrix pendiente de revisar, baja el PDF y corre `npm run matrix`, que lo compara
# celda a celda con el catalogo SIN ESCRIBIR NADA. El issue ya no dice solo «cambio»: dice que
# cifras cambiaron. Es el unico job que instala dependencias (pdf-parse), y por eso:
#   - no tiene escritura ni guarda el token, igual que `medir`;
#   - instala con `npm ci --ignore-scripts`: el lock y su integridad se respetan, pero ninguna
#     dependencia ejecuta codigo al instalarse (sqlite3 no hace falta para leer un PDF);
#   - su resultado es un artefacto que `publicar` valida campo a campo antes de escribirlo.
# Si falla o no hay nada pendiente, `publicar` sigue igual que antes.
#
# CUARTO JOB, `contrastar_cisco` (2026-10-21). Las fichas de Cisco y Meraki son paginas dinamicas
# (`estable: false`): su hash varia en cada peticion y el vigia no las deja nunca pendientes, asi
# que el hash no avisaria de una cifra cambiada. Este job no espera a un «pendiente»: cada lunes
# trae las fichas que cita el catalogo y corre `npm run cisco -- --traer`, que las contrasta celda
# a celda SIN ESCRIBIR NADA. No instala nada (el comando solo usa fs, path y fetch, y lee
# legacyData/), no tiene escritura ni guarda el token, y su resultado es un artefacto que
# `publicar` valida antes de escribir: la URL de cada ficha tiene que ser una que fuentes.js declare.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      contrastar_matrix:
        description: 'Contrastar el Fortinet Product Matrix con el catalogo aunque no este pendiente'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `npm ci` a proposito: scripts/vigia-fuentes.js solo usa fs, path, crypto y fetch.
      # Si algun dia necesita un paquete, este job falla en rojo con MODULE_NOT_FOUND y se ve.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # --escribir actualiza fuentes.lock.json con lo medido. Sin eso el vigia compararia
      # siempre contra un lock vacio, reportaria "primera medicion" cada semana y no
      # detectaria un cambio jamas — un vigia que no recuerda no vigila. El resumen legible
      # sale del MISMO JSON (--resumen) y no de una segunda pasada por la red.
      - name: Revisar las fuentes
        run: |
          node scripts/vigia-fuentes.js --json --escribir > vigia.json
          node scripts/vigia-fuentes.js --resumen vigia.json | tee resumen.txt

      - name: Publicar el resumen en la corrida
        run: |
          {
            echo '## Vigía de fuentes'
            echo '```'
            cat resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar lo medido para el job que publica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vigia
          path: |
            vigia.json
            server/seed/legacyData/fuentes.lock.json
          if-no-files-found: error

  contrastar:
    needs: medir
    if: ${{ needs.medir.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pendiente: ${{ steps.pendiente.outputs.pendiente }}
      ademanda: ${{ steps.pendiente.outputs.ademanda }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Bajar lo medido
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vigia
          path: ${{ runner.temp }}/vigia

      # La URL sale de fuentes.js; del lock medido solo se toma si esta pendiente y su hash.
      # A demanda (`contrastar_matrix` al lanzarlo a mano) se contrasta aunque no este pendiente:
      # es la forma de comparar el documento sin una maquina con salida a fortinet.com.
      - name: Ver si el Product Matrix quedo pendiente
        id: pendiente
        env:
          FORZAR: ${{ inputs.contrastar_matrix }}
        run: |
          forzar=''
          if [ "$FORZAR" = 'true' ]; then forzar='--forzar'; fi
          node scripts/contrastar-matrix.js --pendiente "$RUNNER_TEMP/vigia/server/seed/legacyData/fuentes.lock.json" $forzar >> "$GITHUB_OUTPUT"

      - name: Instalar sin ejecutar scripts de instalacion
        if: ${{ steps.pendiente.outputs.pendiente == 'true' }}
        run: npm ci --ignore-scripts

      # Salida 1 es «hay diferencias», que es justo lo que se quiere contar; solo 2 (no se pudo
      # leer el documento) deja el paso en rojo, y `publicar` lo dice en el issue.
      - name: Contrastar el Product Matrix con el catalogo
        if: ${{ steps.pendiente.outputs.pendiente == 'true' }}
        env:
          URL_MATRIX: ${{ steps.pendiente.outputs.url }}
          HASH_MEDIDO: ${{ steps.pendiente.outputs.hash }}
        run: |
          mkdir -p "$RUNNER_TEMP/matrix"
          set +e
          node scripts/contrastar-matrix.js --url "$URL_MATRIX" --hash-esperado "$HASH_MEDIDO" --json > "$RUNNER_TEMP/matrix/matrix.json"
          codigo=$?
          set -e
          node scripts/contrastar-matrix.js --url "$URL_MATRIX" --hash-esperado "$HASH_MEDIDO" > "$RUNNER_TEMP/matrix/matrix.txt" || true
          # Tambien al log: se lee por la API aunque el almacen de artefactos no sea alcanzable.
          cat "$RUNNER_TEMP/matrix/matrix.txt"
          {
            echo '## Contraste del Product Matrix'
            echo '```'
            cat "$RUNNER_TEMP/matrix/matrix.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" -gt 1 ]; then exit "$codigo"; fi

      - name: Guardar el contraste para el job que publica
        if: ${{ steps.pendiente.outputs.pendiente == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix/matrix.json
          if-no-files-found: error

  contrastar_cisco:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `npm ci` a proposito: scripts/contrastar-cisco.js solo usa fs, path y fetch.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # Salida 1 es «algo difiere» y 2 «una ficha no se pudo usar»: las dos son lo que se quiere
      # contar, asi que el paso no se pone en rojo por ellas; el JSON las lleva al issue.
      - name: Contrastar las fichas de Cisco y Meraki con el catalogo
        run: |
          mkdir -p "$RUNNER_TEMP/cisco"
          set +e
          node scripts/contrastar-cisco.js --traer --json > "$RUNNER_TEMP/cisco/cisco.json"
          codigo=$?
          set -e
          echo "Salida del contraste: $codigo"
          node -e "const d = require(process.argv[1]); for (const f of d.fichas) console.log((f.error ? 'NO SE PUDO ' + f.error : 'casan ' + f.casan + ' difieren ' + f.difieren.length + ' sin leer ' + f.sinLeer.length) + ' :: ' + f.url)" "$RUNNER_TEMP/cisco/cisco.json" | tee "$RUNNER_TEMP/cisco/cisco.txt"
          {
            echo '## Contraste de las fichas de Cisco y Meraki'
            echo '```'
            cat "$RUNNER_TEMP/cisco/cisco.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el contraste para el job que publica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cisco
          path: ${{ runner.temp }}/cisco/cisco.json
          if-no-files-found: error

  # Corre aunque `medir` falle: una corrida que no termina tiene que decirlo en el issue, que es
  # donde se mira. Un rojo que solo se ve entrando en Actions es como la vigia paso tres
  # semanas sin avisar.
  publicar:
    needs: [medir, contrastar, contrastar_cisco]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      # Con credenciales: este job empuja la rama del lock. Nada de lo que corre aqui viene de
      # fuera del repositorio.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # Fuera del repositorio: lo que trae el artefacto no puede caer encima de un archivo del
      # checkout (un hook de git, un script) antes de validarse.
      - name: Bajar lo medido
        id: bajar
        if: ${{ needs.medir.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vigia
          path: ${{ runner.temp }}/vigia

      - name: Bajar el contraste del Product Matrix
        id: bajar-matrix
        if: ${{ needs.contrastar.result == 'success' && needs.contrastar.outputs.pendiente == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix

      - name: Bajar el contraste de las fichas de Cisco
        id: bajar-cisco
        if: ${{ needs.contrastar_cisco.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cisco
          path: ${{ runner.temp }}/cisco

      - name: Validar lo medido y traer el lock
        id: validar
        if: ${{ steps.bajar.outcome == 'success' }}
        run: node scripts/vigia-publicar.js "$RUNNER_TEMP/vigia"

      # EL LOCK VA POR UNA RAMA Y UN PR, NO POR PUSH A main (2026-09-14).
      #
      # MEDIDO: el commit 61dedc65 de este mismo workflow se desplego en Railway con SUCCESS
      # SIN que corrieran ni `verificar` ni `pantallas`: los eventos disparados con el
      # GITHUB_TOKEN por defecto no crean corridas nuevas, para evitar bucles recursivos. Asi
      # que Railway no espera a un check que nunca llega a crearse. Por PR el camino a main
      # pasa por una persona, y el merge de esa persona SI dispara verificar y pantallas.
      #
      # Un PAT o un App token harian que el push disparara los workflows, pero meten un secreto
      # de larga vida con escritura sobre main: peor, y la misma forma que este repositorio ya
      # rechazo al descartar el entorno de staging.
      #
      # El push, el que fallaba con «stale info», vive ahora en scripts/empujar-rama.js,
      # compartido con aplicar-propuesta y datasheets-aruba: hace `git add` antes de mirar si
      # hay cambios (un archivo sin seguimiento no sale en `git diff`), reconstruye la rama
      # sobre main, la empuja con la lease que espera la cabeza actual y no pisa un commit que
      # no sea del bot. Deja `estado` (empujada, sin-cambios, retenida o fallida).
      - name: Guardar lo medido en una rama
        id: guardar
        if: ${{ steps.validar.outcome == 'success' }}
        run: |
          node scripts/empujar-rama.js --rama vigia/fuentes --mensaje 'vigia: actualiza el hash de las fuentes medidas' -- server/seed/legacyData/fuentes.lock.json

      # El PR no se crea desde aqui: el ajuste que lo permitiria tambien deja a Actions aprobar
      # PR. Se busca el que haya abierto una persona y, si no hay, se da el enlace para abrirlo.
      # Se escribe en el issue cuando hay algo que hacer: un documento que cambio o que no se
      # pudo leer, un push rechazado, o una corrida que no llego a publicarse. Un documento sin
      # cambios no merece ruido semanal.
      - name: Enlazar el PR del lock y escribir el issue
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MEDIR: ${{ needs.medir.result }}
          BAJAR: ${{ steps.bajar.outcome }}
          VALIDAR: ${{ steps.validar.outcome }}
          GUARDAR: ${{ steps.guardar.outcome }}
          ESTADO_LOCK: ${{ steps.guardar.outputs.estado }}
          CONTRASTAR: ${{ needs.contrastar.result }}
          MATRIX_PENDIENTE: ${{ needs.contrastar.outputs.pendiente }}
          MATRIX_A_DEMANDA: ${{ needs.contrastar.outputs.ademanda }}
          CONTRASTAR_CISCO: ${{ needs.contrastar_cisco.result }}
          BAJAR_CISCO: ${{ steps.bajar-cisco.outcome }}
        with:
          script: |
            const fs = require('fs');
            const V = require('./scripts/vigia-publicar.js');
            const { owner, repo } = context.repo;
            const corrida = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const dir = `${process.env.RUNNER_TEMP}/vigia`;
            // Se reutiliza el issue abierto si ya existe, para no acumular uno por semana. La API
            // de issues devuelve tambien los PR con la etiqueta: no son el aviso.
            const escribir = async (titulo, cuerpo) => {
              const abiertos = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'vigia-fuentes' });
              const abierto = abiertos.data.find((i) => !i.pull_request);
              if (abierto) {
                await github.rest.issues.createComment({ owner, repo, issue_number: abierto.number, body: cuerpo });
                core.info(`Comentado el issue #${abierto.number}.`);
              } else {
                const nuevo = await github.rest.issues.create({ owner, repo, title: titulo, body: cuerpo, labels: ['vigia-fuentes'] });
                core.info(`Abierto el issue #${nuevo.data.number}.`);
              }
            };
            const { MEDIR, BAJAR, VALIDAR } = process.env;
            if (MEDIR !== 'success' || BAJAR !== 'success' || VALIDAR !== 'success') {
              let motivo = MEDIR !== 'success' ? `la medición no terminó (${MEDIR})`
                : BAJAR !== 'success' ? 'no se pudo bajar lo medido' : 'la validación no terminó';
              try { motivo = JSON.parse(fs.readFileSync(`${dir}/rechazo.json`, 'utf8')).motivo; } catch { /* sin motivo escrito */ }
              await escribir(V.TITULO_FALLO, V.cuerpoFallo(motivo, corrida));
              core.warning(`La corrida no se publicó: ${motivo}`);
              return;
            }
            const inf = JSON.parse(fs.readFileSync(`${dir}/informe.json`, 'utf8'));
            // El contraste del Product Matrix, si estaba pendiente: validado antes de usarlo.
            let matrix = null;
            if (process.env.CONTRASTAR === 'failure') matrix = { error: 'el job contrastar no terminó (descarga o lectura del PDF)' };
            else if (process.env.MATRIX_PENDIENTE === 'true') {
              try {
                const r = V.resumenMatrix(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/matrix/matrix.json`, 'utf8')),
                  { aDemanda: process.env.MATRIX_A_DEMANDA === 'true' });
                matrix = r.error ? { error: r.error } : r.matrix;
              } catch (e) { matrix = { error: `no se pudo leer matrix.json: ${e.message}` }; }
            }
            // El contraste de las fichas de Cisco y Meraki corre cada semana: validado antes de usarlo.
            let cisco = null;
            if (process.env.CONTRASTAR_CISCO !== 'success' || process.env.BAJAR_CISCO !== 'success') {
              cisco = { error: `el job contrastar_cisco no terminó (${process.env.CONTRASTAR_CISCO || 'sin resultado'})` };
            } else {
              try {
                const r = V.resumenCisco(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/cisco/cisco.json`, 'utf8')));
                cisco = r.error ? { error: r.error } : r.cisco;
              } catch (e) { cisco = { error: `no se pudo leer cisco.json: ${e.message}` }; }
            }
            // Un paso que falla puede no dejar su salida: el resultado del paso manda.
            const estado = process.env.GUARDAR === 'failure' ? 'fallida' : (process.env.ESTADO_LOCK || 'sin-cambios');
            let enlace = null;
            if (estado === 'empujada') {
              const abiertos = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${V.RAMA}` });
              enlace = abiertos.data.length
                ? `ya está abierto el PR #${abiertos.data[0].number}.`
                : `[abrir el PR](${context.serverUrl}/${owner}/${repo}/compare/main...${V.RAMA}?expand=1).`;
            }
            const resumen = {
              empujada: `En la rama ${V.RAMA}: ${enlace}`,
              retenida: `La rama ${V.RAMA} tiene un commit que no es del vigía y no se pisó.`,
              fallida: `No se pudo empujar la rama ${V.RAMA}: lo medido está en el artefacto de la corrida.`,
            };
            await core.summary.addHeading('Lock de esta corrida', 3).addRaw(resumen[estado] || 'El lock no cambió.').write();
            if (!V.hayQueAvisar(inf, { estado }, matrix, cisco)) {
              core.info('Ninguna fuente cambió ni quedó sin leer: no hace falta escribir en el issue.');
              return;
            }
            await escribir(V.tituloIssue(inf, matrix, cisco), V.cuerpoIssue(inf, { estado, enlace }, matrix, cisco));
