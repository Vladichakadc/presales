name: vigia-fuentes

# Vigila los documentos oficiales de los que sale el catalogo y abre un issue cuando alguno
# cambia. Corre en GitHub Actions y no en el entorno donde se edita el repositorio porque
# alli el proxy de egreso de la organizacion responde 403 a fortinet.com, juniper.net y a los
# dominios de HPE y Huawei; los ejecutores de GitHub no pasan por ese proxy.
#
# SI TAMPOCO DESDE AQUI SE ALCANZAN, el informe lo dira con el codigo exacto y el issue lo
# recogera. Eso es un resultado valido: significa que el pendiente vuelve a la ruta A de
# IMPORTAR-CATALOGO.md (correrlo desde una maquina propia). No se intenta ninguna otra salida.
#
# NO EXTRAE DATOS. Compara hashes y avisa. La lectura del documento sigue siendo humana y el
# dato entra por npm run cps / juniper / huawei, que contrastan antes de escribir: extraer
# una tabla de un PDF automaticamente es justo donde se cuelan las filas desplazadas.
#
# DOS JOBS (2026-10-02). Hasta ese dia un solo job tenia `contents: write`, `issues: write` y
# `pull-requests: write`, dejaba el token guardado en .git/config y, con el, corria `npm ci`
# (que ejecuta los scripts de instalacion de cada dependencia) y procesaba lo que devolvian
# seis dominios de fabricantes. Una dependencia comprometida podia leer ese token y empujar a
# main, que en este repositorio es desplegar en produccion. Ahora:
#   - `medir` solo puede leer, no guarda el token y no instala nada: el script solo usa
#     modulos de Node y `fetch`. Deja lo medido como artefacto.
#   - `publicar` tiene los permisos y no ejecuta nada que venga de fuera: baja el artefacto
#     FUERA del repositorio, lo valida contra el lock de main (scripts/vigia-publicar.js:
#     la corrida no puede dar por verificado un documento que cambio) y solo entonces copia
#     el lock, empuja la rama y escribe el issue. Corre aunque `medir` falle, y cualquier
#     fallo (la medicion, la descarga, la validacion o el push) acaba escrito en el issue.
#
# Y SE MIDIO QUE LA VIGIA LLEVABA TRES SEMANAS SIN AVISAR. La corrida del 2026-09-21 empujo la
# rama y fallo al crear el PR («GitHub Actions is not permitted to create or approve pull
# requests»: un ajuste del repositorio que esta apagado, y que si se enciende tambien deja a
# Actions APROBAR PR). La del 2026-09-28 fallo antes, en el push («stale info»: con la rama ya
# creada, `--force-with-lease` sin valor esperado no tiene contra que comparar en un checkout
# que solo trae main). Como el job se cortaba ahi, el issue no se actualizaba. Ahora el PR no
# se crea desde aqui: el issue y el resumen de la corrida llevan el enlace para abrirlo.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Sin `npm ci` a proposito: scripts/vigia-fuentes.js solo usa fs, path, crypto y fetch.
      # Si algun dia necesita un paquete, este job falla en rojo con MODULE_NOT_FOUND y se ve.
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # --escribir actualiza fuentes.lock.json con lo medido. Sin eso el vigia compararia
      # siempre contra un lock vacio, reportaria "primera medicion" cada semana y no
      # detectaria un cambio jamas — un vigia que no recuerda no vigila. El resumen legible
      # sale del MISMO JSON (--resumen) y no de una segunda pasada por la red.
      - name: Revisar las fuentes
        run: |
          node scripts/vigia-fuentes.js --json --escribir > vigia.json
          node scripts/vigia-fuentes.js --resumen vigia.json | tee resumen.txt

      - name: Publicar el resumen en la corrida
        run: |
          {
            echo '## Vigía de fuentes'
            echo '```'
            cat resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar lo medido para el job que publica
        uses: actions/upload-artifact@v4
        with:
          name: vigia
          path: |
            vigia.json
            server/seed/legacyData/fuentes.lock.json
          if-no-files-found: error

  # Corre aunque `medir` falle: una corrida que no termina tiene que decirlo en el issue, que es
  # donde se mira. Un rojo que solo se ve entrando en Actions es como la vigia paso tres
  # semanas sin avisar.
  publicar:
    needs: medir
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      # Con credenciales: este job empuja la rama del lock. Nada de lo que corre aqui viene de
      # fuera del repositorio.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Fuera del repositorio: lo que trae el artefacto no puede caer encima de un archivo del
      # checkout (un hook de git, un script) antes de validarse.
      - name: Bajar lo medido
        id: bajar
        if: ${{ needs.medir.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: vigia
          path: ${{ runner.temp }}/vigia

      - name: Validar lo medido y traer el lock
        id: validar
        if: ${{ steps.bajar.outcome == 'success' }}
        run: node scripts/vigia-publicar.js "$RUNNER_TEMP/vigia"

      # EL LOCK VA POR UNA RAMA Y UN PR, NO POR PUSH A main (2026-09-14).
      #
      # MEDIDO: el commit 61dedc65 de este mismo workflow se desplego en Railway con SUCCESS
      # SIN que corrieran ni `verificar` ni `pantallas`: los eventos disparados con el
      # GITHUB_TOKEN por defecto no crean corridas nuevas, para evitar bucles recursivos. Asi
      # que Railway no espera a un check que nunca llega a crearse. Por PR el camino a main
      # pasa por una persona, y el merge de esa persona SI dispara verificar y pantallas.
      #
      # Un PAT o un App token harian que el push disparara los workflows, pero meten un secreto
      # de larga vida con escritura sobre main: peor, y la misma forma que este repositorio ya
      # rechazo al descartar el entorno de staging.
      #
      # Se hace `git add` ANTES de comprobar si hay cambios: `git diff` no ve un archivo sin
      # seguimiento, asi que en la primera corrida -justo cuando el lock todavia no existe y es
      # cuando mas importa guardarlo- habria dicho "sin cambios" y no habria guardado nada.
      #
      # LA LEASE LLEVA EL VALOR ESPERADO. Una sola rama reutilizada, reconstruida cada semana
      # sobre main, y se sobrescribe solo si su cabeza es un commit del propio vigia: si una
      # persona empujo encima, no se pisa (el aviso lo dice y lo medido queda en el artefacto).
      # Sin rama remota, la lease vacia exige que siga sin existir.
      - name: Guardar lo medido en una rama
        id: guardar
        if: ${{ steps.validar.outcome == 'success' }}
        run: |
          git add -- server/seed/legacyData/fuentes.lock.json
          if git diff --cached --quiet -- server/seed/legacyData/fuentes.lock.json; then
            echo 'El lock no cambió; no hay nada que guardar.'
            echo 'estado=sin-cambios' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B vigia/fuentes
          git commit -q -m 'vigia: actualiza el hash de las fuentes medidas'
          esperado=''
          if git fetch -q --depth=1 origin '+refs/heads/vigia/fuentes:refs/remotes/origin/vigia/fuentes' 2>/dev/null; then
            autor="$(git log -1 --format=%ae refs/remotes/origin/vigia/fuentes)"
            if [ "$autor" != 'github-actions[bot]@users.noreply.github.com' ]; then
              echo '::warning::La rama vigia/fuentes tiene encima un commit que no es del vigía: no se pisa.'
              echo "Autor de ese commit: $autor"
              echo 'estado=retenida' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            esperado="$(git rev-parse refs/remotes/origin/vigia/fuentes)"
          fi
          if ! git push -q --force-with-lease="vigia/fuentes:$esperado" origin vigia/fuentes; then
            echo 'estado=fallida' >> "$GITHUB_OUTPUT"
            echo '::error::No se pudo empujar la rama vigia/fuentes. El issue se escribe igual.'
            exit 1
          fi
          echo 'Lo medido está en la rama vigia/fuentes.'
          echo 'estado=empujada' >> "$GITHUB_OUTPUT"

      # El PR no se crea desde aqui: el ajuste que lo permitiria tambien deja a Actions aprobar
      # PR. Se busca el que haya abierto una persona y, si no hay, se da el enlace para abrirlo.
      # Se escribe en el issue cuando hay algo que hacer: un documento que cambio o que no se
      # pudo leer, un push rechazado, o una corrida que no llego a publicarse. Un documento sin
      # cambios no merece ruido semanal.
      - name: Enlazar el PR del lock y escribir el issue
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          MEDIR: ${{ needs.medir.result }}
          BAJAR: ${{ steps.bajar.outcome }}
          VALIDAR: ${{ steps.validar.outcome }}
          GUARDAR: ${{ steps.guardar.outcome }}
          ESTADO_LOCK: ${{ steps.guardar.outputs.estado }}
        with:
          script: |
            const fs = require('fs');
            const V = require('./scripts/vigia-publicar.js');
            const { owner, repo } = context.repo;
            const corrida = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const dir = `${process.env.RUNNER_TEMP}/vigia`;
            // Se reutiliza el issue abierto si ya existe, para no acumular uno por semana. La API
            // de issues devuelve tambien los PR con la etiqueta: no son el aviso.
            const escribir = async (titulo, cuerpo) => {
              const abiertos = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'vigia-fuentes' });
              const abierto = abiertos.data.find((i) => !i.pull_request);
              if (abierto) {
                await github.rest.issues.createComment({ owner, repo, issue_number: abierto.number, body: cuerpo });
                core.info(`Comentado el issue #${abierto.number}.`);
              } else {
                const nuevo = await github.rest.issues.create({ owner, repo, title: titulo, body: cuerpo, labels: ['vigia-fuentes'] });
                core.info(`Abierto el issue #${nuevo.data.number}.`);
              }
            };
            const { MEDIR, BAJAR, VALIDAR } = process.env;
            if (MEDIR !== 'success' || BAJAR !== 'success' || VALIDAR !== 'success') {
              let motivo = MEDIR !== 'success' ? `la medición no terminó (${MEDIR})`
                : BAJAR !== 'success' ? 'no se pudo bajar lo medido' : 'la validación no terminó';
              try { motivo = JSON.parse(fs.readFileSync(`${dir}/rechazo.json`, 'utf8')).motivo; } catch { /* sin motivo escrito */ }
              await escribir(V.TITULO_FALLO, V.cuerpoFallo(motivo, corrida));
              core.warning(`La corrida no se publicó: ${motivo}`);
              return;
            }
            const inf = JSON.parse(fs.readFileSync(`${dir}/informe.json`, 'utf8'));
            // Un paso que falla puede no dejar su salida: el resultado del paso manda.
            const estado = process.env.GUARDAR === 'failure' ? 'fallida' : (process.env.ESTADO_LOCK || 'sin-cambios');
            let enlace = null;
            if (estado === 'empujada') {
              const abiertos = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${V.RAMA}` });
              enlace = abiertos.data.length
                ? `ya está abierto el PR #${abiertos.data[0].number}.`
                : `[abrir el PR](${context.serverUrl}/${owner}/${repo}/compare/main...${V.RAMA}?expand=1).`;
            }
            const resumen = {
              empujada: `En la rama ${V.RAMA}: ${enlace}`,
              retenida: `La rama ${V.RAMA} tiene un commit que no es del vigía y no se pisó.`,
              fallida: `No se pudo empujar la rama ${V.RAMA}: lo medido está en el artefacto de la corrida.`,
            };
            await core.summary.addHeading('Lock de esta corrida', 3).addRaw(resumen[estado] || 'El lock no cambió.').write();
            if (!V.hayQueAvisar(inf, { estado })) {
              core.info('Ninguna fuente cambió ni quedó sin leer: no hace falta escribir en el issue.');
              return;
            }
            await escribir(V.tituloIssue(inf), V.cuerpoIssue(inf, { estado, enlace }));
