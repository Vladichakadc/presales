name: sonda-huawei

# Prueba si los dominios de Huawei son alcanzables desde un ejecutor de GitHub Actions, antes
# de construir cualquier automatismo sobre ellos. Este entorno de edicion recibe 403 al
# intentar llegar a e.huawei.com, support.huawei.com e info.support.huawei.com (pendiente 14
# en PENDIENTES.md); Fortinet y Juniper ya demostraron que un 403 de este proxy no significa
# que el dominio este caido en general -los ejecutores de GitHub llegan por una red distinta-,
# pero eso no estaba probado todavia para Huawei. Esta sonda no descarga nada de catalogo, solo
# mide con que codigo HTTP responde cada dominio.
#
# info.support.huawei.com exige sesion iniciada para el detalle de ciclo de vida (documentado
# en legacyData/fuentes.js): que responda sin 403 no implica que el contenido util este
# disponible sin credenciales, solo que la red llega.

on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probar los tres dominios
        run: |
          node -e "
            const dominios = [
              'https://e.huawei.com/en/products/routers/ar-router',
              'https://e.huawei.com/en/products/enterprise-networking/routers',
              'https://support.huawei.com/enterprise/en/index.html',
              'https://info.support.huawei.com/info-finder/encyclopedia/en/AR.html',
            ];
            (async () => {
              const resultados = [];
              for (const url of dominios) {
                try {
                  const r = await fetch(url, {
                    headers: { 'User-Agent': 'Mozilla/5.0 (presales-sonda-huawei/1.0)' },
                    redirect: 'follow',
                  });
                  resultados.push({ url, status: r.status, alcanzable: true });
                } catch (e) {
                  resultados.push({ url, error: String(e.message || e), alcanzable: false });
                }
              }
              console.log(JSON.stringify(resultados, null, 2));
              require('fs').writeFileSync('sonda-resultado.json', JSON.stringify(resultados, null, 2));
            })();
          "

      - name: Resumen
        if: always()
        run: |
          {
            echo '## Sonda de alcance a dominios de Huawei'
            echo ''
            echo '```json'
            cat sonda-resultado.json 2>/dev/null || echo '(sin resultado: revisar el paso anterior)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
