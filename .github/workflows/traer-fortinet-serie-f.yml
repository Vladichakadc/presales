name: traer-fortinet-serie-f

# Baja las fichas de la generacion F antigua, que estan en OTRA RUTA del sitio.
#
# POR QUE ESTE SEGUNDO WORKFLOW
# La primera tanda (16 series bajadas, 31 modelos aplicados) fallo con 404 en las 12 series F
# mas antiguas. No era que el documento no existiera: Fortinet las publica en
# `/assets/data-sheets/<archivo>` y las nuevas en `/assets/data-sheets/pdf/<archivo>` -un
# subdirectorio de diferencia-. Lo confirmo una busqueda que devolvio las de 1800F, 3000F y
# 4200F con la ruta corta. Es exactamente por esto que el workflow anterior reportaba los 404
# en vez de darlos por buenos: un 404 es informacion, y aqui dijo donde seguir buscando.
#
# Mismo contrato que la primera tanda: firma `%PDF-` obligatoria, lo que no la trae se reporta
# y no se guarda, y no se extrae nada -la lectura de la tabla "Dimensions and Power" sigue
# siendo humana, pagina por pagina.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Bajar las fichas de la generacion F
        run: |
          node -e "
            const fs = require('fs');
            const base = 'https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/';
            const series = ['70f', '100f', '200f', '1800f', '2600f', '3000f', '3200f',
              '3500f', '3700f', '4200f', '4400f', '4800f'];
            const espera = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const informe = [];
              for (const s of series) {
                const nombre = \`fortigate-\${s}-series.pdf\`;
                try {
                  const r = await fetch(base + nombre, {
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                      Accept: 'application/pdf,*/*',
                    },
                  });
                  const buf = Buffer.from(await r.arrayBuffer());
                  const esPdf = buf.length > 4 && buf.subarray(0, 5).toString('latin1') === '%PDF-';
                  if (esPdf) fs.writeFileSync(nombre, buf);
                  informe.push({ serie: s, status: r.status, bytes: buf.length, esPdf });
                  console.log(s, esPdf ? 'OK' : 'HTTP ' + r.status);
                } catch (e) {
                  informe.push({ serie: s, error: String(e.message || e) });
                }
                await espera(1500 + Math.random() * 1500);
              }
              console.log(\`\n\${informe.filter((x) => x.esPdf).length} de \${series.length} bajadas.\`);
              fs.writeFileSync('serie-f-informe.json', JSON.stringify(informe, null, 2));
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fuente/fortinet-serie-f
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ./*.pdf serie-f-informe.json
          git commit -q -m 'Fichas de la generacion F de FortiGate, material de trabajo'
          git push -f origin fuente/fortinet-serie-f

      - name: Resumen
        if: always()
        run: |
          {
            echo '## FortiGate — fichas de la generacion F (ruta sin /pdf/)'
            echo ''
            echo '```json'
            cat serie-f-informe.json 2>/dev/null || echo '(sin resultado: revisar el paso anterior)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
