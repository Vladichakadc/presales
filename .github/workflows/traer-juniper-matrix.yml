name: traer-juniper-matrix

# Baja la SRX Series and vSRX Performance and Features Matrix a una rama de transporte, para
# leerla desde una sesion que no tiene salida a juniper.net. NO extrae la tabla: eso sigue
# siendo `npm run juniper`, con su doble anclaje, sobre un CSV que alguien transcribe a mano
# tras leer el documento de verdad -exactamente lo que este repositorio exige para no colarse
# una fila desplazada. Mismo patron que traer-fortinet-matrix.yml (pendiente 2, cerrado el
# 2026-09-02): el proxy de egreso de este entorno responde 403 a juniper.net, pero los
# ejecutores de GitHub Actions no pasan por ese proxy.
#
# POR QUE UNA RAMA Y NO main NI UN PR. El PDF no es un activo de la aplicacion: es material de
# trabajo para completar juniper.js, y una vez transcrito no hace falta conservarlo commiteado.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Las URL salen de FUENTES (server/seed/legacyData/fuentes.js), las mismas que usa
      # npm run vigia: no hay una segunda lista de URLs que se pueda desincronizar. Ademas de
      # la matriz comparativa, trae las dos fichas individuales que esa misma matriz enlaza
      # como vigentes (SRX300 y SRX1500), para contrastar cualquier cifra que no case.
      - name: Descargar los documentos
        run: |
          node -e "
            const fs = require('fs');
            const { FUENTES } = require('./server/seed/legacyData/fuentes');
            const objetivo = [
              { re: /Performance and Features Matrix/i, archivo: 'SRX_Performance_Matrix.pdf' },
              { re: /SRX300 Line/i, archivo: 'SRX300_Datasheet.pdf' },
              { re: /SRX1500 Services Gateway/i, archivo: 'SRX1500_Datasheet.pdf' },
            ];
            (async () => {
              fs.mkdirSync('fuente-juniper', { recursive: true });
              for (const { re, archivo } of objetivo) {
                const fuente = FUENTES.juniper.find((f) => re.test(f.documento));
                if (!fuente || !fuente.url) { console.error('No se encontro ' + archivo + ' en FUENTES.'); process.exit(1); }
                const res = await fetch(fuente.url, { headers: { 'User-Agent': 'presales-traer-fuente/1.0' } });
                if (!res.ok) { console.error(archivo + ': HTTP ' + res.status); process.exit(1); }
                const buf = Buffer.from(await res.arrayBuffer());
                if (buf.subarray(0, 4).toString() !== '%PDF') {
                  console.error(archivo + ': el contenido no empieza con %PDF (firma: ' + buf.subarray(0, 8).toString('hex') + ').');
                  process.exit(1);
                }
                fs.writeFileSync('fuente-juniper/' + archivo, buf);
                console.log(archivo + ': ' + buf.length + ' bytes, firma %PDF confirmada.');
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B fuente/juniper-srx-matrix
          git add fuente-juniper
          git commit -m "Documentos SRX descargados $(date -u +%Y-%m-%d)"
          git push --force origin fuente/juniper-srx-matrix

      - name: Resumen
        run: |
          {
            echo '## SRX Performance Matrix descargado'
            echo ''
            echo "Rama \`fuente/juniper-srx-matrix\`. Traerlo con:"
            echo '```'
            echo 'git fetch origin fuente/juniper-srx-matrix'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
