name: traer-mikrotik-fichas

# Trae las fichas de producto de MikroTik para completar la alimentacion electrica de los 9
# modelos de hardware que siguen sin dato (pendiente 15; MikroTik va 3 de 15).
#
# POR QUE ESTE FABRICANTE SE PUEDE INTENTAR
# El vigia ya leia mikrotik.com sin problema desde un ejecutor de Actions, al contrario que
# HPE y Huawei, que devuelven un "Access Denied" de Akamai. Y MikroTik publica en cada ficha
# de producto una tabla con "Max power consumption" y el modo de alimentacion, que es
# exactamente lo que `psu` necesita.
#
# LAS FICHAS SON HTML, NO PDF
# Aqui no vale la firma `%PDF-`: lo que se comprueba es que la pagina mencione el modelo y
# traiga texto de consumo. Una pagina de listado o un 404 con plantilla se reportan como lo
# que son, en vez de guardarse como si fueran la ficha.
#
# LOS SLUGS NO SE ADIVINAN DE UNO: se prueban varios candidatos por modelo y se reporta cual
# funciono. Tres estan confirmados por busqueda (rb5009ug_s_in, rb5009upr_s_in,
# rb4011igs_rm); el resto sigue el patron del sitio y el 404 es informacion, igual que lo fue
# con las fichas de Fortinet.
#
# NO EXTRAE NADA: publica el HTML en una rama de transporte para que una persona lea la tabla
# y transcriba.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Pedir las fichas
        run: |
          node -e "
            const fs = require('fs');
            const base = 'https://mikrotik.com/product/';
            const modelos = {
              'hex-lite': ['rb750r2', 'hex_lite'],
              'hex': ['hex', 'rb750gr3'],
              'hex-s': ['hex_s', 'rb760igs'],
              'l009': ['l009uigs_2haxd_in', 'l009uigs_2haxd', 'l009uigs_rm'],
              'rb4011': ['rb4011igs_rm', 'rb4011igs'],
              'rb5009': ['rb5009ug_s_in'],
              'rb5009upr': ['rb5009upr_s_in'],
              'ccr2004-16g': ['ccr2004_16g_2s_plus', 'ccr2004_16g_2splus'],
            };
            const espera = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const informe = [];
              for (const [clave, slugs] of Object.entries(modelos)) {
                let guardado = null;
                const intentos = [];
                for (const slug of slugs) {
                  try {
                    const r = await fetch(base + slug, {
                      headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                        'Accept-Language': 'en-US,en;q=0.9',
                      },
                    });
                    const html = await r.text();
                    // Una ficha de verdad menciona el consumo; un 404 con plantilla, no.
                    const util = r.status === 200 && /power consumption|Powering/i.test(html);
                    intentos.push({ slug, status: r.status, bytes: html.length, util });
                    if (util) { fs.writeFileSync(clave + '.html', html); guardado = slug; break; }
                  } catch (e) {
                    intentos.push({ slug, error: String(e.message || e) });
                  }
                  await espera(1500 + Math.random() * 1500);
                }
                informe.push({ modelo: clave, guardado, intentos });
                console.log(clave, guardado || 'sin ficha');
                await espera(1500 + Math.random() * 1500);
              }
              console.log(\`\n\${informe.filter((x) => x.guardado).length} de \${Object.keys(modelos).length} con ficha.\`);
              fs.writeFileSync('mikrotik-informe.json', JSON.stringify(informe, null, 2));
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fuente/mikrotik-fichas
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ./*.html mikrotik-informe.json
          git commit -q -m 'Fichas de producto de MikroTik, material de trabajo'
          git push -f origin fuente/mikrotik-fichas

      - name: Resumen
        if: always()
        run: |
          {
            echo '## MikroTik — fichas de producto (pendiente 15)'
            echo ''
            echo '```json'
            cat mikrotik-informe.json 2>/dev/null || echo '(sin resultado: revisar el paso anterior)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
