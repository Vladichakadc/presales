name: pantallas

# Conduce TODAS las pantallas en un navegador de verdad, detras del muro de acceso, y sube
# una captura de cada una. Es la mitad del pendiente 4 que faltaba.
#
# DESDE EL 2026-09-16 ESTE JOB HACIA DOS COSAS, Y DESDE EL 2026-09-24 HACE TRES, distintas a
# proposito:
#   · `pantallas`  comprueba que NADA EXPLOTA -- sin errores de consola, sin peticiones
#     fallidas al propio origen, sin contenedores vacios. No compara ninguna cifra, y no debe:
#     una asercion sobre «3,1 Gbps» se romperia en cada cambio de catalogo, que es como se
#     ensena a la gente a ignorar un rojo.
#   · `contraste`  compara lo que la pantalla RECOMIENDA para un escenario ya medido contra
#     la linea base de antes de un refactor. Eso no lo cubre ni `verificar` (funciones puras)
#     ni `pantallas`, y es justo donde un refactor rompe en silencio.
#   · `e2e`  conduce FLUJOS completos (elegir un equipo, cotizarlo, exportar el Excel, abrir un
#     enlace compartido, la auditoria de accesibilidad) y afirma lo que la pantalla dice en
#     cada paso. Hasta el 2026-09-24 solo corria cuando alguien se acordaba: tres de sus
#     baterias salieron en verde con fallos impresos y nadie lo vio.
# Se quedan en el mismo job porque los tres necesitan exactamente lo que este ya monta:
# Chromium, un servidor y una clave efimera.
#
# POR QUE AQUI Y NO CONTRA UN SITIO DESPLEGADO. `DATABASE_PATH` va sin definir en produccion,
# asi que la base es efimera y se resiembra desde `server/seed/legacyData/` en CADA
# despliegue: lo que pinta una pantalla es funcion del commit, no del entorno. Este job
# arranca ESE MISMO COMMIT con NODE_ENV=production, asi que renderiza exactamente los mismos
# datos que produccion. La alternativa que se estudio -un entorno de staging en Railway- habria
# anadido una segunda copia publica del catalogo de PRECIOS, tras una contrasena guardada en
# los secretos del repositorio (legibles por cualquiera que pueda empujar un workflow), para no
# ver nada que no se vea aqui. Aqui la clave la genera el propio job y muere con el.
#
# Lo que este workflow NO cubre -que el dominio publico este vivo: DNS, TLS, el edge de
# Railway- lo cubre `sonda-produccion.yml`. Son las dos mitades, y ninguna sustituye a la otra.
#
# ESTE CHECK NO FRENA EL DESPLIEGUE, aunque esta cabecera lo afirmo hasta el 2026-09-13.
# Medido ese dia: el commit 7fe786e desplego en Railway con estado SUCCESS teniendo este job en
# rojo desde hacia cuatro dias. Y medido el 2026-09-23: Railway no espera a NINGUN workflow
# (`checkSuites: false` en el servicio): el despliegue dcb662d9 termino de construir antes de
# que `verificar` acabara. Se deja escrito porque una cabecera que promete una proteccion
# inexistente es peor que no prometer nada: haria leer un rojo de aqui como «ya esta contenido,
# no llega a produccion», y si llega. Lo cierra activar «Wait for CI» en el servicio de Railway
# (punto 33 de PENDIENTES.md); con eso Railway esperaria a TODOS los workflows del commit,
# este incluido.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pantallas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Playwright va con --no-save a proposito, igual que para `npm run manual`: un Chromium
      # descargado pesa cientos de MB y no tiene por que bajarse en cada `npm install` de este
      # repositorio, que no lo necesita para nada mas.
      #
      # Y VA FIJADO (2026-09-24). Sin version, cada corrida traia la ultima que hubiera en npm.
      # La del 24-sep (35946092377) bajo Chromium 153 y su informe de cobertura solo conto los
      # modulos del ULTIMO caso: 19 «sin conducir», entre ellos el dimensionador de Fortinet,
      # que cinco casos de esa misma corrida conducen. La medicion local, con 1.56.1, suma entre
      # paginas y da 8. Y ERA LA VERSION: con 1.56.1 fijado, la corrida 35985786379 vuelve a
      # sumar y da 8 «sin conducir», lo mismo que en local. Una herramienta que cambia sola entre
      # dos corridas del mismo commit es una fuente de rojos (o de verdes) que no dicen nada del
      # codigo, y la bateria e2e —que espera a condiciones medidas en el navegador— es justo lo
      # que no puede depender de eso. 1.56.1 es la version con la que se validan la bateria, las
      # pantallas y el contraste; subirla es un commit, con su diff.
      - name: Traer Playwright y Chromium
        id: playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Arrancar el servidor en modo produccion
        id: servidor
        env:
          NODE_ENV: production
          PORT: 4000
          AUTH_USER: verificacion
          SESSION_SECRET: secreto-solo-de-esta-corrida
          AUTH_STATE_DIR: ./.auth-pantallas
          DATABASE_PATH: ./pantallas.sqlite
        run: |
          # La contrasena se genera aqui y no sale del ejecutor: nunca es un secreto del
          # repositorio ni una credencial que abra nada mas que este proceso efimero.
          AUTH_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
          echo "::add-mask::$AUTH_PASSWORD"
          echo "AUTH_PASSWORD=$AUTH_PASSWORD" >> "$GITHUB_ENV"
          AUTH_PASSWORD="$AUTH_PASSWORD" npm start > arranque.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q 'Presales corriendo en' arranque.log && break
            sleep 1
          done
          grep -q '\[seed\]' arranque.log || { echo 'FALTA la linea [seed]'; cat arranque.log; exit 1; }
          grep -q 'Presales corriendo en' arranque.log || { echo 'el servidor no llego a escuchar'; cat arranque.log; exit 1; }

      - name: Conducir las pantallas
        env:
          AUTH_USER: verificacion
        run: npm run pantallas -- --base=http://127.0.0.1:4000 --salida=./capturas

      # EL CONTRASTE VA AQUI Y NO EN UN WORKFLOW APARTE porque necesita exactamente lo que
      # este job ya tiene montado: Chromium, un servidor en modo produccion y una clave que
      # vive y muere con la corrida. Un workflow propio pagaria ese montaje dos veces para
      # comprobar lo mismo sobre el mismo commit.
      #
      # QUE ANADE SOBRE LAS PANTALLAS, que es lo que justifica el paso. `pantallas` comprueba
      # que nada explota: sin errores de consola, sin peticiones fallidas, sin contenedores
      # vacios. NO compara ninguna cifra contra nada — y no debe, porque una asercion sobre
      # «3,1 Gbps» se romperia en cada cambio de catalogo. El contraste compara otra cosa: que
      # un REFACTOR no cambie la recomendacion que la pantalla da para un escenario ya medido.
      # Ninguno de los dos cubre eso hoy, y la prueba de que hace falta es que el caso de
      # Nokia cazo una regresion real (dos tildes perdidas en texto visible) el mismo dia que
      # se escribio.
      #
      # `--todos` deriva la lista de `scripts/contrastes/`: anadir un caso es anadir un
      # archivo, no tocar este workflow. Una lista aqui se quedaria atras y un caso que nunca
      # corre se porta igual que uno que pasa.
      #
      # SE EJECUTA AUNQUE LAS PANTALLAS FALLEN (pero no si el servidor no arranco): las dos
      # comprobaciones miran cosas distintas y tener las dos en el mismo informe es lo que
      # evita una segunda corrida para enterarse de la segunda mitad.
      # Y de paso MIDE que modulos de public/js/ ejercita la corrida (page.coverage de
      # Chromium): el informe sale en el resumen y el artefacto lleva el detalle. No se
      # declara por caso a proposito — un `cubre: ['bom.js']` escrito a mano da una cobertura
      # falsa, que es peor que no tener el dato. En el ejecutor el fichero NO se commitea (un
      # push de bot no dispara CI, ver la cabecera de vigia-fuentes.yml): viaja como artefacto.
      #
      # `set -o pipefail` (2026-09-24): sin `shell:` explicito GitHub corre `bash -e {0}`, SIN
      # pipefail, asi que el codigo de salida de `... | tee` era el de tee. `contraste.js` sale
      # con 1 si hay discrepancias y este paso habria salido VERDE igualmente: el log de la
      # corrida 35946092377 muestra `shell: /usr/bin/bash -e {0}`. Hasta hoy no habia ocultado
      # nada —esa corrida paso de verdad, 7 casos sin discrepancias—, pero un comprobador que no
      # puede fallar se porta igual que uno que pasa.
      - name: Contrastar que los refactores no cambian lo que se recomienda
        if: ${{ !cancelled() && steps.servidor.conclusion == 'success' }}
        env:
          AUTH_USER: verificacion
        run: |
          set -o pipefail
          node scripts/contraste.js --todos --base=http://127.0.0.1:4000 | tee contraste.txt

      - name: Publicar el contraste en la corrida
        if: ${{ !cancelled() && hashFiles('contraste.txt') != '' }}
        run: |
          {
            echo '## Contraste antes/despues'
            echo ''
            echo '```'
            cat contraste.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # LA BATERIA E2E (2026-09-24). Levanta su PROPIO servidor (puerto 4131, base y usuarios en
      # un directorio temporal de la corrida) y conduce los flujos completos, uno por script.
      # Corre aunque las pantallas o el contraste fallen, por la misma razon que el contraste:
      # tres informes en una corrida en vez de tres corridas para enterarse. Solo necesita que
      # Playwright se haya instalado.
      #
      # POR QUE NO ES UN ROJO AL AZAR. La bateria espera a que la pagina TERMINE lo que empezo
      # (test/e2e/ayuda.js, asentar) y no a un reloj, y se comprobo con la CPU del navegador
      # ralentizada 4x y 10x (E2E_LENTITUD): pasa entera. La version anterior, de 219 pausas
      # fijas, tambien pasaba —tenia margen—, pero tardaba 336 s donde esta tarda 114 y, si algo
      # no llegaba, no decia que. Un rojo de este paso es un flujo roto, no una maquina lenta.
      #
      # La clave de la corrida se genera aqui y muere con ella, como la del servidor de arriba.
      - name: Bateria e2e (flujos completos en el navegador)
        if: ${{ !cancelled() && steps.playwright.conclusion == 'success' }}
        run: |
          set -o pipefail
          E2E_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
          echo "::add-mask::$E2E_PASSWORD"
          E2E_PASSWORD="$E2E_PASSWORD" npm run e2e 2>&1 | tee e2e.txt

      - name: Publicar la bateria e2e en la corrida
        if: ${{ !cancelled() && hashFiles('e2e.txt') != '' }}
        run: |
          {
            echo '## Bateria e2e'
            echo ''
            echo '```'
            grep -E '^(══|──|\[e2e)|RESULTADO|^FALLO' e2e.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantallas-${{ github.sha }}
          path: |
            capturas/
            contraste.txt
            e2e.txt
            scripts/contrastes/cobertura.lock.json
          retention-days: 30
          if-no-files-found: warn

      - name: Resumen
        if: always()
        run: |
          {
            echo '## Pantallas conducidas en un navegador'
            echo ''
            echo 'Las capturas de cada pantalla van como artefacto de esta corrida.'
            echo ''
            if [ -f capturas/informe.json ]; then
              node -e "
                const f = require('./capturas/informe.json');
                console.log('| Pantalla | ms | Estado |');
                console.log('|---|---:|---|');
                for (const r of f) {
                  const mal = r.error || r.problemas.length;
                  const detalle = r.error ? r.error : (r.problemas.join(' · ') || 'sin novedad');
                  console.log(\`| \${r.pantalla} | \${r.ms} | \${mal ? 'ROTA — ' : 'ok — '}\${detalle.replace(/\|/g, '/')} |\`);
                }
              "
            else
              echo '(sin informe: el servidor o el navegador no llegaron a arrancar; revisa los pasos anteriores)'
            fi
            echo ''
            echo '_El servidor corre en el propio ejecutor con `NODE_ENV=production` y la base sembrada desde `legacyData/`, que es exactamente lo que sirve produccion: la base alli es efimera y se resiembra en cada despliegue._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log del servidor si algo fallo
        if: failure()
        run: cat arranque.log
