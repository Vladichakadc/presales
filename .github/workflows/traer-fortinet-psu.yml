name: traer-fortinet-psu

# Trae los documentos oficiales de Fortinet sobre alimentacion electrica por modelo, para
# leerlos a mano y cerrar el pendiente 15 por el lado de Fortinet (hoy 0 de 58 modelos con
# `redund`/`psu`, el hueco mas grande de esa dimension en todo el catalogo).
#
# POR QUE UN WORKFLOW
# `WebFetch` esta bloqueado en la sesion donde se edita este repositorio -denegado por igual
# contra fortinet.com, docs.fortinet.com y community.fortinet.com-, asi que las pistas que
# PENDIENTES.md ya recogio por busqueda web quedaron como "fragmentos sin confirmar por
# lectura directa". Los ejecutores de Actions si alcanzan fortinet.com: es el mismo camino que
# trajo el Product Matrix y cerro el pendiente 2.
#
# SOLO FUENTES OFICIALES DEL FABRICANTE
# Las fichas de reventa que la busqueda tambien encontro (corporatearmor.com y similares) no
# entran aqui a proposito: este catalogo no sustituye una cifra ausente por una copia de un
# tercero -la misma regla que deja en `null` el firewall del Aruba 9100-. Si Fortinet no lo
# publica, el campo se queda vacio y la ficha lo declara.
#
# LO QUE ESTE WORKFLOW NO HACE
# No extrae ni transcribe nada. Publica el HTML en una rama de transporte para que una persona
# lo lea y copie la frase literal a `redund`/`psu`. Deducir la fuente del tamano o la gama del
# equipo es justo lo que la convencion de alimentacion electrica prohibe.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Pedir los documentos
        run: |
          node -e "
            const fs = require('fs');
            const docs = {
              'fg-100f-psu.html': 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-Checking-FortiGate-100F-series-power-supply/ta-p/267021',
              'fg-100e-200e-psu.html': 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-check-power-supply-details-for-FortiGate/ta-p/193557',
              'fg-7081f-psu.html': 'https://docs.fortinet.com/document/fortigate-7000/hardware/fortigate-7081f-system-guide/12189/ac-psus-and-supplying-ac-power-to-the-chassis',
              'fg-7121f-psu.html': 'https://docs.fortinet.com/document/fortigate-7000/hardware/fortigate-7121f-system-guide/410545/hot-swapping-an-ac-psu',
            };
            const espera = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const informe = [];
              for (const [archivo, url] of Object.entries(docs)) {
                try {
                  const r = await fetch(url, {
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                      'Accept-Language': 'en-US,en;q=0.9',
                    },
                  });
                  const html = await r.text();
                  fs.writeFileSync(archivo, html);
                  informe.push({
                    archivo, status: r.status, bytes: html.length,
                    // Un 'Access Denied' de Akamai es la pared del fabricante, no un fallo de
                    // red: se reporta tal cual, como ya se hizo con Huawei y con HPE.
                    accesoDenegado: /access denied|edgesuite|reference #/i.test(html),
                    mencionaFuente: /power suppl|PSU|redundant|hot.?swap/i.test(html),
                  });
                } catch (e) {
                  informe.push({ archivo, error: String(e.message || e) });
                }
                await espera(2000 + Math.random() * 2000);
              }
              console.log(JSON.stringify(informe, null, 2));
              fs.writeFileSync('psu-informe.json', JSON.stringify(informe, null, 2));
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fuente/fortinet-psu
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ./*.html psu-informe.json
          git commit -q -m 'Documentos de alimentacion electrica de Fortinet, material de trabajo'
          git push -f origin fuente/fortinet-psu

      - name: Resumen
        if: always()
        run: |
          {
            echo '## Fortinet — alimentacion electrica (pendiente 15)'
            echo ''
            echo '```json'
            cat psu-informe.json 2>/dev/null || echo '(sin resultado: revisar el paso anterior)'
            echo '```'
            echo ''
            echo 'Publicado en `fuente/fortinet-psu`. La transcripcion a `redund`/`psu` es manual.'
          } >> "$GITHUB_STEP_SUMMARY"
