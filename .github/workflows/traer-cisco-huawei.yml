name: traer-cisco-huawei

# Baja a una rama de transporte los documentos oficiales que hacen falta para dos cosas que
# este repositorio NO puede resolver leyendo un resumen de buscador:
#
#   CISCO · las 14 cifras en que el cotizador y el dimensionador no coinciden (`npm run
#           catalogo`, seccion «COTIZADOR FRENTE A DIMENSIONADOR»). Hasta resolverlas con la
#           ficha, ninguna de las dos se puede declarar buena, y el cotizador no puede tomar
#           la cifra del dimensionador sin riesgo de propagar una mala.
#   HUAWEI · los boletines de fin de venta (EOM) del AR651/AR651W y la consulta de ciclo de
#           vida de Info-Finder. Y desde el 2026-10-02, las fichas del NE8000 M8 y F8, cuyas
#           cifras de capacidad tampoco coinciden entre el cotizador y el dimensionador, y la
#           del M14: el dimensionador dice 2 Tbps y la guia de diseno 7,2. De la ficha del M14
#           solo se conoce la pagina de documentos (el identificador del material); la URL del
#           PDF se DESCUBRE en esa pagina, no se adivina por patron. Y desde el 2026-10-05, las
#           fichas de las series AR (AR610, AR650, AR5710-S, AR6710-H, AR8000): el `typ` vacio del
#           AR611 y del AR651, y el del AR8700-8, que el catalogo daba como 24 Gbps. Y las
#           fichas de NE8000 M6, M1A, M1D-B, serie X y A800 E: sus figuras oficiales van a la
#           tarjeta grafica del dimensionador (2026-10-06). Esa misma tarde, las de los ocho que
#           se quedaron sin figura (AR6710-L, NE8000 M1C, M1D, M4 y F1A) y las fichas
#           individuales de la A800 E, porque el folleto de la serie da al A816 E una capacidad
#           imposible para sus ocho puertos GE.
#           LO QUE NO SE PUEDE TRAER (medido el 2026-10-06): las descripciones de hardware de
#           support.huawei.com (`/enterprise/en/doc/EDOC...`), que dirian cuantas fuentes vienen
#           de serie y el codigo de cada modulo. Pedidas con fetch devuelven un 200 de 3.800
#           bytes, el cascaron de la aplicacion sin el documento (corrida 37453468795); abiertas
#           con Chromium sin cabeza, un 403 «Access Denied» de Akamai en las catorce (corrida
#           37454219168). Es el fabricante quien niega el acceso automatizado, y no se rodea.
#   ARUBA · las guias de instalacion de los controladores 7000/7200 (2026-10-06, pendiente 41):
#           sus vistas frontal y trasera van a la tarjeta grafica del dimensionador, que hoy
#           muestra el aviso honesto en esos nueve modelos. El dominio de HPE esta bloqueado
#           desde el entorno de edicion; `arubanetworking.hpe.com/techdocs` ya sirvio desde
#           Actions el EdgeConnect Hardware Reference.
#   JUNIPER · el datasheet vigente de la linea SRX300 (2026-10-02): el cotizador cita del
#           SRX340 4,7 Gbps y 733 Mbps y el dimensionador 3 Gbps y 600 Mbps de la matriz de
#           2020. Las dos son oficiales; hay que leer la tabla entera para decidir cual manda. Desde el entorno de edicion `support.huawei.com` e
#           `info.support.huawei.com` responden `connect_rejected` del proxy de egreso; aqui se
#           prueba desde un ejecutor, y si Huawei pide sesion o el CDN lo corta, el informe lo
#           dice con su codigo en vez de guardarlo.
#
# NO EXTRAE NADA. La lectura sigue siendo humana y el dato entra por los importadores con
# doble anclaje (`npm run huawei -- eox.csv --eol` para el ciclo de vida). Las URL salieron
# de BUSCAR cada documento el 2026-10-01, no de adivinarlas por patron: la primera corrida de
# `traer-fortinet-pendientes.yml` adivino quince y dieron 404 las quince.
#
# LA FIRMA DEL CONTENIDO MANDA SOBRE EL CODIGO HTTP. Una pagina HTML se valida por un texto
# que solo puede estar en el documento correcto: un 200 con la pagina de login o con un
# cascaron de JavaScript no es el boletin.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

