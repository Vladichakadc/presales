name: aplicar-propuesta

# Aplica una propuesta de la Sincronización Inteligente sobre server/seed/legacyData/ y la deja
# en una rama para revisarla. Es la mitad que hace durable lo que el panel analiza: en
# producción el análisis lee el catálogo y devuelve cambios, pero escribir en su base no
# persiste (se resiembra en cada deploy). El camino real es este, y el token con permiso de
# escritura al repo vive AQUÍ, en Actions, nunca en el servicio que sirve los precios.
#
# CÓMO SE USA (también desde el móvil, en la app de GitHub):
#   1. En el panel «Sincronización Inteligente», Analizar y luego «Descargar propuesta».
#   2. Actions -> aplicar-propuesta -> Run workflow, y pega el contenido del JSON descargado.
#   3. El workflow aplica solo lo que ancla (ver scripts/importar-propuesta.js), corre
#      `npm run verificar` y, si todo pasa, deja el cambio en la rama `propuesta/<fabricante>-<corrida>`.
#      El resumen de la corrida trae el enlace para abrir el PR. Nada llega a main sin esa revisión.
#
# POR QUÉ ANCLAJE Y NO CONFIANZA. La propuesta la genera una IA que pudo leer un documento
# subido por cualquiera. El importador solo acepta un UPDATE cuyo oldValue coincide de verdad
# con lo que el catálogo dice hoy, sobre un modelo que existe, con URL de fuente oficial; las
# altas se reportan pero nunca se aplican solas. Y `npm run verificar` es el segundo muro: si
# la escritura dejara el archivo inválido, las pruebas no pasan y no se publica nada.
#
# DOS JOBS (2026-10-02), por lo mismo que la vigía de fuentes. `aplicar` instala dependencias
# (`npm ci` ejecuta los scripts de instalación de cada una), aplica y verifica sin permiso de
# escritura y sin guardar el token, y deja el diff como parche. `publicar` tiene el permiso y no
# instala nada: vuelve a aplicar la propuesta con el importador, exige que el resultado sea byte
# a byte el parche verificado, y empuja la rama (scripts/empujar-rama.js). Lo que llega a la
# rama lo escribe siempre código del repositorio, nunca el job que ejecutó dependencias.
#
# Y EL FABRICANTE SE COMPRUEBA AL PRINCIPIO (scripts/leer-propuesta.js). La versión anterior lo
# metía en comandos de shell para nombrar la rama y el commit, y solo no era explotable porque
# el importador no aplica nada con un fabricante desconocido. Ahora tiene que ser uno de los que
# conoce el importador, y git se llama con argumentos, sin shell.
#
# EL PR NO LO ABRE ACTIONS: en este repositorio GitHub no lo permite («GitHub Actions is not
# permitted to create or approve pull requests»), y el ajuste que lo permitiría también deja a
# Actions aprobar PR. Así falló `datasheets-aruba.yml` el 2026-09-02 y la vigía dos lunes
# seguidos; este workflow no se había ejecutado nunca y habría fallado igual.

on:
  workflow_dispatch:
    inputs:
      propuesta:
        description: 'Pega aquí el JSON descargado del panel (incluye vendor y cambios).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hay: ${{ steps.cambio.outputs.hay }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La propuesta entra por variable de entorno, nunca interpolada en el script.
      - name: Leer la propuesta y su fabricante
        id: leer
        env:
          PROPUESTA: ${{ inputs.propuesta }}
        run: |
          printf '%s' "$PROPUESTA" > propuesta.json
          vendor="$(node scripts/leer-propuesta.js propuesta.json)"
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
          echo "Fabricante: $vendor"

      # El importador escribe solo lo que ancla y reporta el resto. Su salida es la lista de qué
      # se aplicó y qué se apartó y por qué. `pipefail`, para que `| tee` no se trague un error.
      - name: Aplicar con anclaje
        run: |
          set -o pipefail
          node scripts/importar-propuesta.js propuesta.json --aplicar | tee informe.txt

      - name: ¿Cambió algo?
        id: cambio
        run: |
          if git diff --quiet -- server/seed/legacyData/; then
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo 'La propuesta no dejó ningún cambio anclado: no hay rama que abrir.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay=1" >> "$GITHUB_OUTPUT"
            git diff -- server/seed/legacyData/ > propuesta.patch
          fi

      # El segundo muro: si la escritura dejó el catálogo inválido, esto falla y no se publica.
      - name: Verificar (lint + pruebas)
        if: steps.cambio.outputs.hay == '1'
        run: npm run verificar

      - name: Guardar el parche para el job que publica
        if: steps.cambio.outputs.hay == '1'
        uses: actions/upload-artifact@v4
        with:
          name: propuesta
          path: |
            propuesta.patch
            informe.txt
          if-no-files-found: error

  publicar:
    needs: aplicar
    if: ${{ needs.aplicar.outputs.hay == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Con credenciales: este job empuja la rama. Nada de lo que corre aquí viene de fuera.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      # Fuera del repositorio: el artefacto no puede caer sobre un archivo del checkout.
      - name: Bajar el parche verificado
        uses: actions/download-artifact@v4
        with:
          name: propuesta
          path: ${{ runner.temp }}/propuesta

      # LO QUE SE PUBLICA LO ESCRIBE CODIGO DEL REPOSITORIO, NO EL OTRO JOB. Los archivos de
      # legacyData/ son modulos que el servidor ejecuta al sembrar, asi que aplicar un parche que
      # viene del job de `npm ci` dejaria que un paquete comprometido colara una linea de codigo
      # donde el importador solo cambia un valor. Aqui se vuelve a aplicar la propuesta con el
      # importador (sin dependencias: solo fs, path y los modulos de legacyData) y se exige que
      # el resultado sea, byte a byte, el que paso `npm run verificar` en el job anterior. El
      # fabricante tambien se lee aqui: nada de lo que este job usa sale de las salidas del otro.
      - name: Aplicar con el importador y comparar con lo verificado
        id: aplicar
        env:
          PROPUESTA: ${{ inputs.propuesta }}
        run: |
          printf '%s' "$PROPUESTA" > "$RUNNER_TEMP/propuesta.json"
          vendor="$(node scripts/leer-propuesta.js "$RUNNER_TEMP/propuesta.json")"
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
          node scripts/importar-propuesta.js "$RUNNER_TEMP/propuesta.json" --aplicar > /dev/null
          git diff -- server/seed/legacyData/ > "$RUNNER_TEMP/publicado.patch"
          if ! cmp -s "$RUNNER_TEMP/publicado.patch" "$RUNNER_TEMP/propuesta/propuesta.patch"; then
            echo '::error::Lo que aplica este job no es lo que verificó el anterior: no se publica nada.'
            exit 1
          fi
          echo 'El cambio coincide byte a byte con el que pasó npm run verificar.'

      - name: Guardar en una rama
        id: guardar
        env:
          VENDOR: ${{ steps.aplicar.outputs.vendor }}
        run: |
          node scripts/empujar-rama.js --rama "propuesta/$VENDOR-$GITHUB_RUN_ID" --mensaje "Sincronización IA: catálogo $VENDOR" -- server/seed/legacyData/

      - name: Enlazar el PR
        if: ${{ !cancelled() && steps.guardar.outcome != 'skipped' }}
        env:
          VENDOR: ${{ steps.aplicar.outputs.vendor }}
          ESTADO: ${{ steps.guardar.outputs.estado }}
        run: |
          rama="propuesta/$VENDOR-$GITHUB_RUN_ID"
          {
            echo "## Propuesta de la sincronización: $VENDOR"
            echo ''
            if [ "$ESTADO" = 'empujada' ]; then
              echo "Aplicada con anclaje y verificada, en la rama \`$rama\`: [abrir el PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$rama?expand=1)."
              echo 'Revísala como cualquier cambio de catálogo: el diff es la fuente de verdad.'
            else
              echo "No se pudo guardar en una rama (estado: ${ESTADO:-desconocido}). El motivo está en el paso anterior."
            fi
            echo ''
            echo '```'
            tr '`' "'" < "$RUNNER_TEMP/propuesta/informe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
