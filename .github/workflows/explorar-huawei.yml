name: explorar-huawei

# Segundo paso de la sonda de Huawei (ver sonda-huawei.yml): los cuatro dominios respondieron
# 200, pero un 200 no dice si el contenido es el dato real o una pagina de acceso. Este
# workflow baja el HTML completo de un puñado de paginas -listados de producto y una ficha de
# Info-Finder- a la rama de transporte `fuente/huawei-exploracion` para leerlas de verdad desde
# la sesion de edicion, sin login ni credenciales propias. No toca el catalogo.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Bajar el HTML de las paginas de interes
        run: |
          node -e "
            const fs = require('fs');
            const paginas = {
              'ar-router-listado.html': 'https://e.huawei.com/en/products/routers/ar-router',
              'enterprise-networking-routers.html': 'https://e.huawei.com/en/products/enterprise-networking/routers',
              'support-index.html': 'https://support.huawei.com/enterprise/en/index.html',
              'info-finder-ar.html': 'https://info.support.huawei.com/info-finder/encyclopedia/en/AR.html',
            };
            (async () => {
              fs.mkdirSync('huawei-exploracion', { recursive: true });
              for (const [archivo, url] of Object.entries(paginas)) {
                try {
                  const r = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 (presales-explorar-huawei/1.0)' } });
                  const texto = await r.text();
                  fs.writeFileSync('huawei-exploracion/' + archivo, texto);
                  console.log(archivo + ': ' + r.status + ', ' + texto.length + ' bytes');
                } catch (e) {
                  console.log(archivo + ': ERROR ' + String(e.message || e));
                }
              }
            })();
          "

      - name: Publicar en la rama de transporte
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B fuente/huawei-exploracion
          git add huawei-exploracion
          git commit -m "Exploracion de paginas de Huawei $(date -u +%Y-%m-%d)"
          git push --force origin fuente/huawei-exploracion

      - name: Resumen
        run: |
          {
            echo '## Exploracion de paginas de Huawei'
            echo ''
            echo "Rama \`fuente/huawei-exploracion\`. Traerla con:"
            echo '```'
            echo 'git fetch origin fuente/huawei-exploracion'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
