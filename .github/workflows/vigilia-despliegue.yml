name: vigilia-despliegue

# AVISA CUANDO LA CABEZA DE MAIN NO LLEGA A PRODUCCION (2026-10-28, mejora aprobada por el dueño).
#
# sonda-produccion.yml solo corre cuando Railway da un despliegue por terminado: uno que se queda
# en cola, o que Railway no registra, no avisa a nadie. El 2026-10-28 la fusion del PR #53 espero
# casi una hora en cola y Railway la salto (SKIPPED), y la del PR #51 no creo ningun despliegue;
# se vieron porque una sesion lo miro a mano.
#
# Cada media hora mira la cabeza de main, el CI de ese commit (verificar y pantallas) y sus
# despliegues de produccion. Si lleva mas del margen (90 min) sin un despliegue terminado bien,
# abre un issue con la etiqueta `despliegue-en-espera` y la causa que se ve desde GitHub (CI en
# rojo, en cola, sin despliegue); lo cierra cuando la cabeza queda desplegada. Un despliegue que
# FALLA lo sigue avisando la sonda. La decision y la redaccion viven en
# scripts/vigilia-despliegue.js, que valida lo que llega de la API.
#
# UN SOLO JOB, SIN INSTALAR NADA. No ejecuta codigo de fuera: solo lee la API de GitHub y el
# modulo del repositorio. El permiso de escritura es solo para issues.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      margen:
        description: 'Minutos de espera antes de avisar (15 a 1440)'
        required: false
        default: '90'

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      deployments: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/vigilia-despliegue.js
          sparse-checkout-cone-mode: false

      - name: Comparar la cabeza de main con sus despliegues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARGEN: ${{ inputs.margen }}
        with:
          script: |
            const V = require('./scripts/vigilia-despliegue.js');
            const { owner, repo } = context.repo;
            const rama = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = rama.data.commit.sha;
            const fecha = rama.data.commit.commit.committer.date;
            const checks = (await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })).data.check_runs;
            const deps = (await github.rest.repos.listDeployments({ owner, repo, sha, environment: V.PRODUCCION, per_page: 20 })).data;
            const despliegues = [];
            for (const d of deps) {
              const estados = (await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 10 })).data;
              despliegues.push({ sha: d.sha, created_at: d.created_at, estados });
            }
            const datos = V.leerDatos({ sha, fecha, checks, despliegues });
            const d = V.decidir(datos, Date.now(), V.margen(process.env.MARGEN));
            core.info(`Cabeza ${sha.slice(0, 7)} (${d.minutos} min): ${d.accion} (${d.motivo}).`);
            const urls = {
              repo: `${context.serverUrl}/${owner}/${repo}`,
              corrida: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            };
            const abiertos = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: V.ETIQUETA });
            const abierto = abiertos.data.find((i) => !i.pull_request) || null;
            const p = V.plan(d, abierto);
            core.info(`Aviso: ${p}${abierto ? ` (#${abierto.number})` : ''}.`);
            if (p === 'abrir') {
              const r = await github.rest.issues.create({ owner, repo, title: V.tituloIssue(d), body: V.cuerpoIssue(d, urls), labels: [V.ETIQUETA] });
              core.info(`Abierto el aviso #${r.data.number}.`);
            } else if (p === 'comentar') {
              await github.rest.issues.createComment({ owner, repo, issue_number: abierto.number, body: V.comentarioNuevaCabeza(d, urls) });
              await github.rest.issues.update({ owner, repo, issue_number: abierto.number, title: V.tituloIssue(d) });
            } else if (p === 'cerrar') {
              await github.rest.issues.createComment({ owner, repo, issue_number: abierto.number, body: V.comentarioCierre(d, urls) });
              await github.rest.issues.update({ owner, repo, issue_number: abierto.number, state: 'closed', state_reason: 'completed' });
            }
